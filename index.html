<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>마음의 방탈출</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nanum+Myeongjo:wght@700;800&family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  /* 밤의 방: 짙은 청록 벽, 스탠드 불빛 같은 금빛 버튼, 휴대폰만 푸른빛 */
  --bg-top:#1a2226;
  --bg-bot:#3a4c56;
  --panel:rgba(255,255,255,.05);
  --line:rgba(255,255,255,.12);
  --ink:#f1ece2;
  --dim:#a9b3b8;
  --gold:#f2d27c;
  --gold-ink:#3a2c0c;
  --gold-soft:rgba(242,210,124,.16);
  --screen:#8fd0b5;
  --display:"Nanum Myeongjo","Noto Serif KR",serif;
  --body:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  /* 레이아웃: 위에는 늘 같은 방 그림(무대), 아래에는 지금 단계의 이야기 판 */
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:linear-gradient(180deg,var(--bg-top) 0%,#24313a 45%,var(--bg-bot) 100%) fixed;color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.65;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,[role="button"]:focus-visible{outline:2px solid var(--gold);outline-offset:3px}
.app{max-width:500px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;padding:14px 16px 16px;gap:14px}
.top{display:flex;justify-content:space-between;align-items:center;font-size:13px;color:var(--dim)}
.top b{color:var(--ink);font-weight:600}
.back{background:none;border:0;color:var(--dim);padding:6px 0;font-size:13px}
.topr{display:flex;align-items:center;gap:10px}
.snd{background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:4px 11px;font-size:12px;color:var(--dim)}
.snd[aria-pressed="true"]{color:var(--gold-ink);background:var(--gold);border-color:var(--gold)}
.say{background:none;border:1px solid var(--line);border-radius:999px;padding:3px 10px;font-size:12px;color:var(--gold);align-self:flex-start}
.choose{display:grid;grid-template-columns:1fr 1fr;gap:8px}

/* 무대 */
.stage{position:relative;border-radius:18px;border:1px solid var(--line);background:#141b1f;overflow:hidden;box-shadow:0 20px 40px -24px #000}
.stage svg{display:block;width:100%;height:auto}
.hot{cursor:pointer}
.hot .hl{opacity:0;transition:opacity .3s}
.hot:hover .hl,.hot:focus .hl{opacity:1}
.tag{font:600 9px var(--body);fill:#fff}
.tagbg{fill:rgba(10,14,16,.82);stroke:rgba(255,255,255,.25)}
.hint{margin:0 10px 10px;min-height:40px;display:flex;gap:8px;align-items:center;padding:9px 12px;border-radius:10px;background:rgba(8,12,14,.82);border:1px solid var(--line);font-size:13px;font-weight:600}
.hint::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--gold);flex:none;box-shadow:0 0 8px var(--gold)}
#room{transition:filter 1.2s}
.lightsoff #room{filter:brightness(.38) saturate(.6)}
.phone-g.glow rect.body{filter:drop-shadow(0 0 6px #8fd0b5)}
.phone-g.buzz{animation:buzz .45s linear 4;transform-box:fill-box;transform-origin:center}
@keyframes buzz{25%{transform:rotate(-6deg)}75%{transform:rotate(6deg)}}
.pulse{animation:pulse 2s ease-in-out infinite}
@keyframes pulse{50%{opacity:.35}}
#doorPanel{transition:transform 1.4s cubic-bezier(.6,0,.2,1);transform-box:fill-box;transform-origin:left center}
.dooropen #doorPanel{transform:scaleX(.12)}
#doorLight{opacity:0;transition:opacity 1.4s}
.dooropen #doorLight{opacity:1}
#moon{transition:cx 1s,cy 1s,fill 1s}
#sky{transition:fill 1.2s}

/* 이야기 판 */
.panel{display:flex;flex-direction:column;gap:16px;padding:4px 2px}
.eyebrow{font-size:12px;letter-spacing:.16em;color:var(--gold);font-weight:700}
h1,h2{margin:0;font-weight:700;letter-spacing:-.02em;text-wrap:balance}
h1{font-size:30px;line-height:1.3}
h2{font-size:23px;line-height:1.38}
p{margin:0}
.lede{font-size:16px;color:var(--ink)}
.small{font-size:13px;color:var(--dim)}
.quote{font-family:var(--display);font-size:24px;font-weight:800;line-height:1.45}
.callout{padding:14px 16px;border-left:3px solid var(--gold);background:var(--panel);border-radius:0 10px 10px 0;font-size:15px;font-weight:600;line-height:1.7}
.narr{display:flex;flex-direction:column;gap:6px;font-family:var(--display);font-size:17px;line-height:1.8}
.narr span{opacity:0;transform:translateY(6px);animation:rise .8s ease forwards}
@keyframes rise{to{opacity:1;transform:none}}
.btn{display:block;width:100%;padding:16px 18px;border-radius:12px;border:0;background:linear-gradient(180deg,#f6dd92,var(--gold));color:var(--gold-ink);font-weight:700;font-size:16px;text-align:center;box-shadow:0 8px 20px -12px var(--gold)}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line);box-shadow:none}
.btn:disabled{opacity:.35;cursor:default}
.stack{display:flex;flex-direction:column;gap:9px}
.opt{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:13px 15px;border-radius:12px;border:1px solid var(--line);background:var(--panel);font-size:15px}
.opt[aria-pressed="true"]{border-color:var(--gold);background:var(--gold-soft)}
.opt .n{font-size:12px;color:var(--gold);min-width:16px;font-weight:700;font-variant-numeric:tabular-nums}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{padding:8px 14px;border-radius:999px;border:1px solid var(--line);background:var(--panel);font-size:14px}
.chip[aria-pressed="true"]{border-color:var(--gold);background:var(--gold-soft)}
.note{padding:14px 16px;border-radius:12px;background:#efe6cf;color:#3a3122;font-size:14px;line-height:1.7;transform:rotate(-.6deg);box-shadow:0 6px 16px -10px #000}
.note b{display:block;font-size:12px;letter-spacing:.1em;color:#8a6a2a;margin-bottom:2px}
.clues{display:flex;flex-wrap:wrap;gap:6px}
.clue{font-size:12px;padding:5px 10px;border-radius:999px;background:rgba(143,208,181,.12);color:var(--screen);border:1px solid rgba(143,208,181,.3)}

/* 휴대폰 화면 */
.chat{display:flex;flex-direction:column;gap:7px;padding:14px;border-radius:16px;background:#0e1316;border:1px solid #2a3439;font-size:14px;line-height:1.5;box-shadow:0 0 40px -18px var(--screen)}
.chat .who{font-size:12px;color:var(--dim);text-align:center;padding-bottom:6px;border-bottom:1px solid #1f282c}
.bub{max-width:84%;padding:8px 12px;border-radius:15px}
.bub.me{align-self:flex-end;background:#2f5a4c;border-bottom-right-radius:4px}
.bub.them{align-self:flex-start;background:#232b30;border-bottom-left-radius:4px}
.meta{font-size:11px;color:var(--dim);align-self:flex-end;font-variant-numeric:tabular-nums}
.meta.read{color:var(--screen)}

/* 분류 미션 */
.sortcard{padding:24px 18px;border-radius:14px;background:#efe6cf;color:#2d261a;font-family:var(--display);font-size:21px;font-weight:800;text-align:center;line-height:1.45;min-height:104px;display:flex;align-items:center;justify-content:center;box-shadow:0 10px 24px -14px #000}
.bins{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.bin{padding:13px 6px;border-radius:12px;border:1px solid var(--line);background:var(--panel);font-weight:700;font-size:15px}
.bin small{display:block;font-weight:400;font-size:11px;color:var(--dim)}
.fb{min-height:62px;padding:12px 14px;border-radius:10px;background:var(--panel);font-size:14px;border-left:3px solid var(--line)}
.fb.ok{border-left-color:var(--screen)}
.fb.miss{border-left-color:var(--gold)}
.count{font-variant-numeric:tabular-nums}

/* 장면 */
.locks{display:flex;gap:8px}
.lock{flex:1;padding:8px 4px;border-radius:10px;border:1px solid var(--line);background:var(--panel);text-align:center;font-size:12px;color:var(--dim)}
.lock b{display:block;font-size:16px;color:var(--ink)}
.lock.on{border-color:var(--gold);color:var(--gold)}
.lock.cur{outline:1px solid var(--ink);outline-offset:2px}
.scene{padding:15px 16px;border-radius:12px;background:var(--panel);border:1px solid var(--line)}
.scene .who{font-size:12px;color:var(--screen);margin-bottom:4px;font-weight:600}
.scene p{font-family:var(--display);font-size:17px;line-height:1.7;font-weight:700}

/* 결과 */
.result{padding:20px 18px;border-radius:16px;background:linear-gradient(170deg,rgba(242,210,124,.12),rgba(255,255,255,.03));border:1px solid rgba(242,210,124,.35);display:flex;flex-direction:column;gap:14px}
.meter{display:flex;flex-direction:column;gap:7px}
.meter .row{display:grid;grid-template-columns:84px 1fr 36px;align-items:center;gap:10px;font-size:14px}
.meter .bar{height:6px;border-radius:3px;background:rgba(255,255,255,.12);overflow:hidden}
.meter .bar i{display:block;height:100%;background:var(--gold);border-radius:3px}
.meter .lv{font-size:12px;color:var(--dim);text-align:right}
.insight{font-family:var(--display);font-size:19px;line-height:1.75;font-weight:800}
.chain{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:0}
.chain li{position:relative;padding:10px 14px 10px 92px;border-left:2px solid var(--gold);margin-left:8px;font-size:15px}
.chain li span{position:absolute;left:14px;top:11px;font-size:12px;color:var(--gold);font-weight:700}
.chain li+li::before{content:"↓";position:absolute;left:-9px;top:-11px;font-size:12px;color:var(--gold);background:var(--bg-top);line-height:1}
.habit{padding:16px 18px;border-radius:14px;background:#efe6cf;color:#2d261a;display:flex;flex-direction:column;gap:6px;box-shadow:0 10px 24px -14px #000}
.habit .eyebrow{color:#8a6a2a}
.habit .small{color:#6b5a3a}
.habit-name{font-family:var(--display);font-size:21px;font-weight:800}
.kakao{display:flex;flex-direction:column;gap:10px;padding:14px 16px;border-radius:12px;border:1px solid var(--gold);background:var(--gold-soft);font-size:14px}
.kakao .btn{text-decoration:none}
.kakao[hidden]{display:none}
.copyok{font-size:13px;color:var(--screen);text-align:center;min-height:18px}

/* 지도 */
.map{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.room{padding:11px 12px;border-radius:10px;border:1px solid var(--line);background:var(--panel);text-align:left;display:flex;flex-direction:column;gap:1px;min-height:70px}
.room .no{font-size:11px;color:var(--dim);font-variant-numeric:tabular-nums}
.room .nm{font-weight:700;font-size:15px}
.room .st{font-size:11px;color:var(--dim);margin-top:auto}
.room.open{border-color:var(--gold);background:var(--gold-soft)}
.room.open .st{color:var(--gold)}
.room.done .st{color:var(--screen)}
.room:disabled{cursor:default;opacity:.55}
.annex{display:flex;flex-direction:column;gap:6px;padding:14px 16px;border:1px dashed var(--line);border-radius:12px}
.annex ul{margin:0;padding-left:18px;color:var(--dim);font-size:14px}

/* 진행 */
.prog{display:flex;flex-direction:column;gap:7px;padding-top:4px}
.prog .t{font-size:13px;color:var(--dim);font-weight:600;font-variant-numeric:tabular-nums}
.prog .bar{height:3px;border-radius:2px;background:rgba(255,255,255,.14);overflow:hidden}
.prog .bar i{display:block;height:100%;background:var(--gold);transition:width .6s}
footer{font-size:12px;color:var(--dim);line-height:1.6}
@media (prefers-reduced-motion:reduce){
  .narr span{animation:none;opacity:1;transform:none}
  .phone-g.buzz,.pulse{animation:none}
  #room,#doorPanel,#doorLight,#moon,#sky{transition:none}
}
</style>
</head>
<body>
<div class="app">
  <div class="top">
    <button class="back" id="homeBtn" type="button">← 본관 지도</button>
    <span class="topr"><span id="where"><b>마음의 방탈출</b></span><button class="snd" id="sndBtn" type="button" aria-pressed="false">소리 꺼짐</button></span>
  </div>

  <div class="kakao" id="kakao" hidden>
    <p>카카오톡 안에서는 <b>읽어 주기</b>가 되지 않습니다. 소리까지 들으려면 다른 브라우저로 열어 주세요.</p>
    <a class="btn" id="kakaoOpen" href="#">크롬·삼성 인터넷으로 열기</a>
  </div>

  <div class="stage lightsoff" id="stage">
    <svg viewBox="0 0 360 250" role="img" aria-label="밤의 방. 창문, 스탠드, 책상 위 휴대전화와 쪽지, 서랍, 액자, 잠긴 출구가 있다.">
      <defs>
        <radialGradient id="lampGlow" cx="50%" cy="40%" r="60%"><stop offset="0" stop-color="#ffd978" stop-opacity=".55"/><stop offset="1" stop-color="#ffd978" stop-opacity="0"/></radialGradient>
        <radialGradient id="exitGlow" cx="50%" cy="60%" r="70%"><stop offset="0" stop-color="#fff2c4"/><stop offset="1" stop-color="#f2d27c" stop-opacity=".2"/></radialGradient>
        <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#22302f"/><stop offset="1" stop-color="#1a2524"/></linearGradient>
        <linearGradient id="wood" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#b9824a"/><stop offset="1" stop-color="#8a5a30"/></linearGradient>
      </defs>
      <g id="room">
        <rect width="360" height="250" fill="url(#wall)"/>
        <polygon points="0,200 360,200 360,250 0,250" fill="#3a3a2c"/>
        <line x1="0" y1="200" x2="360" y2="200" stroke="#55523b" stroke-width="2"/>
        <ellipse cx="72" cy="128" rx="80" ry="70" fill="url(#lampGlow)"/>

        <!-- 창문 -->
        <g class="hot" data-obj="window" role="button" tabindex="0" aria-label="창문">
          <rect x="22" y="16" width="96" height="72" rx="2" fill="#2d3c3a" stroke="#4d5d55" stroke-width="2"/>
          <rect id="sky" x="26" y="20" width="88" height="64" fill="#13201f"/>
          <circle id="moon" cx="98" cy="34" r="8" fill="#e9eaa9"/>
          <line x1="70" y1="20" x2="70" y2="84" stroke="#4d5d55" stroke-width="2"/>
          <line x1="26" y1="52" x2="114" y2="52" stroke="#4d5d55" stroke-width="2"/>
          <rect class="hl" x="20" y="14" width="100" height="76" rx="3" fill="none" stroke="#f2d27c" stroke-width="1.5"/>
        </g>

        <!-- 액자 -->
        <g class="hot" data-obj="frame" role="button" tabindex="0" aria-label="액자">
          <rect x="150" y="22" width="68" height="44" fill="#2a2418" stroke="#9a7b45" stroke-width="3"/>
          <text x="184" y="40" text-anchor="middle" font-family="Nanum Myeongjo,serif" font-size="9" font-weight="800" fill="#d8c69a" letter-spacing="2">생각의</text>
          <text x="184" y="54" text-anchor="middle" font-family="Nanum Myeongjo,serif" font-size="9" font-weight="800" fill="#d8c69a" letter-spacing="2">감옥</text>
          <rect class="hl" x="146" y="18" width="76" height="52" fill="none" stroke="#f2d27c" stroke-width="1.5"/>
        </g>

        <!-- 스탠드 -->
        <g class="hot" data-obj="lamp" role="button" tabindex="0" aria-label="스탠드">
          <polygon points="48,104 82,104 74,84 56,84" fill="#f0cd5e"/>
          <rect x="63" y="104" width="4" height="34" fill="#c9a24a"/>
          <rect x="55" y="136" width="20" height="4" rx="1" fill="#c9a24a"/>
          <rect class="hl" x="44" y="80" width="42" height="62" rx="4" fill="none" stroke="#f2d27c" stroke-width="1.5"/>
        </g>

        <!-- 책상 -->
        <rect x="26" y="140" width="210" height="10" rx="2" fill="url(#wood)"/>
        <rect x="34" y="150" width="7" height="50" fill="#6e4625"/>
        <rect x="222" y="150" width="7" height="50" fill="#6e4625"/>

        <!-- 서랍 -->
        <g class="hot" data-obj="drawer" role="button" tabindex="0" aria-label="서랍">
          <rect x="50" y="152" width="100" height="32" rx="3" fill="#9c6a3a" stroke="#c99a5e" stroke-width="1.5"/>
          <rect x="90" y="166" width="20" height="4" rx="2" fill="#f1e2c2"/>
          <rect class="hl" x="47" y="149" width="106" height="38" rx="4" fill="none" stroke="#f2d27c" stroke-width="1.5"/>
        </g>

        <!-- 휴대전화 -->
        <g class="hot phone-g glow" id="phoneG" data-obj="phone" role="button" tabindex="0" aria-label="휴대전화">
          <rect class="body" x="112" y="104" width="24" height="36" rx="4" fill="#7fbfa7" stroke="#22302b" stroke-width="2"/>
          <rect x="116" y="110" width="16" height="22" rx="1" fill="#a9e4cc"/>
          <circle cx="120" cy="121" r="1.4" fill="#22302b"/><circle cx="124" cy="121" r="1.4" fill="#22302b"/><circle cx="128" cy="121" r="1.4" fill="#22302b"/>
          <circle id="phoneDot" class="pulse" cx="134" cy="106" r="3" fill="#f2d27c"/>
          <rect class="hl" x="108" y="100" width="32" height="44" rx="5" fill="none" stroke="#f2d27c" stroke-width="1.5"/>
        </g>
        <rect class="tagbg" x="104" y="156" width="40" height="13" rx="3"/>
        <text class="tag" x="124" y="165.5" text-anchor="middle">휴대전화</text>

        <!-- 쪽지 -->
        <g class="hot" data-obj="memo" role="button" tabindex="0" aria-label="쪽지">
          <rect x="160" y="120" width="36" height="22" fill="#f3dfa0" transform="rotate(-8 178 131)"/>
          <line x1="167" y1="128" x2="188" y2="125" stroke="#b49a5a" stroke-width="1.2"/>
          <line x1="168" y1="133" x2="186" y2="130" stroke="#b49a5a" stroke-width="1.2"/>
          <rect class="hl" x="156" y="113" width="44" height="34" rx="3" fill="none" stroke="#f2d27c" stroke-width="1.5"/>
        </g>

        <!-- 문 -->
        <g class="hot" data-obj="door" role="button" tabindex="0" aria-label="출구 문">
          <rect x="258" y="70" width="78" height="130" fill="#3a2414"/>
          <rect id="doorLight" x="261" y="73" width="72" height="127" fill="url(#exitGlow)"/>
          <g id="doorPanel">
            <rect x="261" y="73" width="72" height="127" fill="#6b4126" stroke="#8c5a35" stroke-width="1.5"/>
            <rect x="269" y="82" width="56" height="48" fill="none" stroke="#83532f" stroke-width="1.5"/>
            <rect x="269" y="140" width="56" height="50" fill="none" stroke="#83532f" stroke-width="1.5"/>
            <circle cx="322" cy="138" r="4" fill="#f2d27c"/>
            <g id="locks">
              <circle cx="279" cy="104" r="5" fill="#2a1a0e" stroke="#a37a45"/>
              <circle cx="292" cy="104" r="5" fill="#2a1a0e" stroke="#a37a45"/>
              <circle cx="305" cy="104" r="5" fill="#2a1a0e" stroke="#a37a45"/>
              <circle cx="318" cy="104" r="5" fill="#2a1a0e" stroke="#a37a45"/>
            </g>
          </g>
          <rect class="hl" x="255" y="67" width="84" height="136" fill="none" stroke="#f2d27c" stroke-width="1.5"/>
        </g>
        <rect class="tagbg" x="281" y="205" width="32" height="13" rx="3"/>
        <text class="tag" x="297" y="214.5" text-anchor="middle">출구</text>

        <!-- 화분 -->
        <rect x="236" y="186" width="16" height="14" rx="2" fill="#4b5a3a"/>
        <circle cx="240" cy="180" r="6" fill="#4f7a52"/><circle cx="249" cy="178" r="6" fill="#5d8a5c"/><circle cx="244" cy="171" r="6" fill="#6a9a66"/>
      </g>
    </svg>
    <div class="hint" id="hint">방이 어둡습니다.</div>
  </div>

  <section class="panel" id="view" aria-live="polite"></section>

  <div class="prog" id="prog"><span class="t" id="progT"></span><span class="bar"><i id="progB"></i></span></div>
  <footer>진단이나 검사가 아닌 자기이해 놀이입니다. 어떤 생각과 감정도 틀린 답이 아닙니다.</footer>
</div>

function touch(obj){
  if(S.view==="home"||S.view==="enter"){ hint("먼저 방에 들어가야 합니다."); return; }
  if(S.view==="dark"){
    if(obj==="phone"){ if(!S.phoneOpen) openPhone(); else hint(`읽음 ${VV().read}. 화면은 그대로입니다.`); return; }
    if(obj==="lamp"){ hint(OBJ_TEXT.lamp); return; }
    if(!S.seen.includes(obj)) S.seen.push(obj);
    hint(obj==="drawer"?VV().drawerHint:obj==="memo"?VV().memoHint:OBJ_TEXT[obj]);
    if(obj==="drawer"||obj==="memo"){
      dark();
      $("#objnote").innerHTML = obj==="drawer"
        ? `<div class="note">${VV().drawerNote}</div>`
        : `<div class="note">${VV().memoNote}</div>`;
    }
    return;
  }
  if(obj==="door"){ hint(S.view==="exit"?"문이 열려 있습니다.":`자물쇠 ${S.picks.filter(p=>p.length>=3).length} / 4 풀림`); return; }
  if(obj==="phone"&&S.view==="reveal"){ hint("답장이 왔습니다."); return; }
  hint(OBJ_TEXT[obj]);
}

/* ---------- 해석 경향 계산 (임시 규칙: 전문가 검토 필요) ---------- */
function score(){
  let rej=0, mind=0, anx=0;
  const f=FIRST[S.first]; rej+=f.rej||0; mind+=f.mind||0; anx+=(f.anx||0)+(f.self||0);
  S.feel.forEach(i=>{rej+=FEEL[i].rej||0; anx+=FEEL[i].anx||0;});
  S.sortLog.forEach(l=>{ if(l.a==="추측"&&l.pick==="정보") mind+=1; });
  S.picks.forEach((p,i)=>{ const t=SC(i).o[p[0]][1]; if(t==="rej"){rej+=1; mind+=1;} if(t==="self"){anx+=1; mind+=1;} });
  const w=REWIND[S.rewind]; rej+=w.rej||0; anx+=w.anx||0;
  anx+=ACT[S.act].anx||0;
  if(S.guess===2) mind+=1;
  const cap=(v,m)=>Math.min(1,v/m);
  return [["거절 민감",cap(rej,8)],["마음 읽기",cap(mind,8)],["관계 불안",cap(anx,7)]];
}
const level=v=>v>=.6?"자주":v>=.3?"가끔":"드묾";
function chainNote(){
  const g=FIRST[S.first].g;
  if(g==="분노") return "‘무시당했다’는 해석이 화를 불렀습니다. 같은 침묵에서도 다른 해석을 했다면 다른 감정이 왔을 수 있습니다.";
  if(g==="불안") return "‘나쁜 일이 생길 것 같다’는 예측이 불안을 불렀습니다. 사건이 아니라 해석이 감정을 만든 고리입니다.";
  if(g==="우울") return "‘내가 부족해서’라는 해석이 마음을 가라앉혔습니다. 침묵이 내 가치를 말해 준 적은 없습니다.";
  return "결론을 미뤄 두자 감정도 크게 흔들리지 않았습니다. 바쁠 거라는 생각도 추측이라는 점은 기억해 두세요.";
}

function exit(){
  hint("문이 열렸습니다.");
  setTimeout(()=>{ if(S.view==="exit" && !exit.spoken){ exit.spoken=true; const m=$(".insight"); if(m) say(m.textContent); } }, 400);
  const sc=score(); const top=[...sc].sort((a,b)=>b[1]-a[1])[0];
  const firstNeg = S.picks.filter((p,i)=>SC(i).o[p[0]][1]!=="neu").length;
  let msg;
  if(top[1]<.3) msg="당신은 침묵을 비어 있는 시간으로 둘 줄 아는 편입니다. 확인하기 전까지 결론을 미뤄 둘 수 있었습니다.";
  else if(top[0]==="거절 민감") msg="당신은 침묵을 공백으로 두기보다, 거절의 신호로 빨리 읽는 편일 수 있습니다.";
  else if(top[0]==="마음 읽기") msg="당신은 확인하기 전에 상대의 마음을 먼저 정해 두는 편일 수 있습니다. 침묵을 의미로 빨리 채우는 습관입니다.";
  else msg="당신은 답이 없는 시간을 오래 견디기 어려운 편일 수 있습니다. 관계가 흔들릴까 봐 마음이 먼저 앞서 갑니다.";
  const takes=["침묵은 대답이 아니라 아직 비어 있는 시간이다.","확인하기 전까지 결론은 연필로 적어 둔다.","내가 느낀 서운함은 진짜지만, 상대의 마음은 아직 모른다."];
  V().innerHTML = `
    <p class="eyebrow">탈출 · 방 2</p>
    <h2>침묵의 방에서 나왔습니다.</h2>
    <div class="result">
      <p class="eyebrow">이번 체험에서 보인 해석 경향</p>
      <p class="insight">${msg}</p>
      <div class="meter">${sc.map(([n,v])=>`<div class="row"><span>${n}</span><span class="bar"><i style="width:${Math.max(6,Math.round(v*100))}%"></i></span><span class="lv">${level(v)}</span></div>`).join("")}</div>
      <p class="small">네 장면 중 <span class="count">${firstNeg}</span>곳에서 처음 떠올린 이유가 '나를 향한 부정적인 뜻'이었습니다. 이 결과는 당신을 정하는 유형이 아니라, 오늘 이 방에서 나타난 반응입니다.</p>
    </div>
    <p class="eyebrow">내 생각 고리</p>
    <ol class="chain">
      <li><span>사건</span>읽고 답이 없다</li>
      <li><span>내 생각</span>“${esc(FIRST[S.first].t)}”</li>
      <li><span>내 감정</span>${S.feel.map(i=>FEEL[i].t).join(" · ")}</li>
      <li><span>내 몸</span>${BODY[S.body]}</li>
      <li><span>내 행동</span>${ACT[S.act].t}</li>
    </ol>
    <p class="small">${chainNote()}</p>
    <div class="habit">
      <p class="eyebrow">오늘 만난 생각 습관 · 1 / 12</p>
      <p class="habit-name">독심술 (지레짐작)</p>
      <p>확인하지 않은 상대의 마음을 이미 안다고 믿는 습관입니다. '답이 없다'는 사실에 '나를 무시한다'는 뜻을 붙일 때 나타납니다.</p>
      <p class="small">연습: 결론 전에 “지금 확인된 것은 무엇인가?”를 먼저 묻기</p>
    </div>
    <p class="eyebrow">오늘 가져갈 문장 하나</p>
    <div class="stack" id="takes">${takes.map((t,i)=>`<button class="opt" type="button" aria-pressed="${S.take===i}" data-i="${i}">${t}</button>`).join("")}</div>
    <button class="btn" type="button" id="share">결과 문구 복사해서 공유하기</button>
    <p class="copyok" id="copyok"></p>
    <button class="btn ghost" type="button" disabled>다음 방: 실수의 방 (준비 중)</button>
    <button class="btn ghost" type="button" id="map">본관 지도로 돌아가기</button>`;
  $("#takes").onclick=e=>{const b=e.target.closest("[data-i]"); if(!b) return; S.take=+b.dataset.i; exit(); syncStage(); prog();};
  $("#map").onclick=()=>{ go("home",0); window.scrollTo(0,0); };
  $("#share").onclick=async()=>{
    const text=`[마음의 방탈출 · 침묵의 방]\n${msg}\n${sc.map(([n,v])=>`${n}: ${level(v)}`).join(" / ")}\n오늘 만난 생각 습관: 독심술(지레짐작)${S.take!==null?`\n오늘 가져갈 문장: ${takes[S.take]}`:""}`;
    try{ await navigator.clipboard.writeText(text); $("#copyok").textContent="복사했습니다. 카톡이나 메모에 붙여 넣으세요."; }
    catch(e){ $("#copyok").textContent="이 화면에서는 복사가 막혀 있습니다. 결과 카드를 캡처해 주세요."; }
  };
}

/* ---------- 소리: 효과음은 코드로 만든 소리, 나레이션은 기기 음성 ---------- */
const SND = {on:false, asked:false, ctx:null, amb:null};
function ac(){ try{ if(!SND.ctx) SND.ctx = new (window.AudioContext||window.webkitAudioContext)(); if(SND.ctx.state==="suspended") SND.ctx.resume(); return SND.ctx; }catch(e){ return null; } }
function env(g, t, peak, a, d){ g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(peak,t+a); g.gain.exponentialRampToValueAtTime(0.0001,t+a+d); }
function noiseBuf(c, sec){ const b=c.createBuffer(1, c.sampleRate*sec, c.sampleRate), d=b.getChannelData(0); for(let i=0;i<d.length;i++) d[i]=Math.random()*2-1; return b; }
function ambient(on){
  const c=ac(); if(!c) return;
  if(on && !SND.amb){
    const src=c.createBufferSource(); src.buffer=noiseBuf(c,3); src.loop=true;
    const lp=c.createBiquadFilter(); lp.type="lowpass"; lp.frequency.value=320;
    const g=c.createGain(); g.gain.value=0.0001; g.gain.exponentialRampToValueAtTime(0.035,c.currentTime+2);
    const hum=c.createOscillator(); hum.frequency.value=55; const hg=c.createGain(); hg.gain.value=0.012;
    src.connect(lp).connect(g).connect(c.destination); hum.connect(hg).connect(g);
    src.start(); hum.start(); SND.amb={src,hum,g};
  } else if(!on && SND.amb){
    const {src,hum,g}=SND.amb; g.gain.exponentialRampToValueAtTime(0.0001,c.currentTime+.6);
    setTimeout(()=>{ try{src.stop();hum.stop();}catch(e){} },700); SND.amb=null;
  }
}
function ticks(n){
  if(!SND.on) return; const c=ac(); if(!c) return;
  for(let i=0;i<n;i++){ const t=c.currentTime+i*.5, o=c.createOscillator(), g=c.createGain(); o.type="square"; o.frequency.value=i%2?1500:1900; o.connect(g).connect(c.destination); env(g,t,.05,.002,.04); o.start(t); o.stop(t+.06); }
}
function buzz(){
  if(!SND.on) return; const c=ac(); if(!c) return;
  for(let i=0;i<3;i++){ const t=c.currentTime+i*.42, o=c.createOscillator(), lp=c.createBiquadFilter(), g=c.createGain(); o.type="sawtooth"; o.frequency.value=150; lp.type="lowpass"; lp.frequency.value=600; o.connect(lp).connect(g).connect(c.destination); env(g,t,.16,.01,.28); o.start(t); o.stop(t+.32); }
}
function chime(){
  if(!SND.on) return; const c=ac(); if(!c) return; const t=c.currentTime;
  [880,1320].forEach((f,i)=>{ const o=c.createOscillator(), g=c.createGain(); o.type="sine"; o.frequency.value=f; o.connect(g).connect(c.destination); env(g,t+i*.08,.07,.01,.9); o.start(t+i*.08); o.stop(t+1.1); });
}
function door(){
  if(!SND.on) return; const c=ac(); if(!c) return; const t=c.currentTime;
  const s=c.createBufferSource(); s.buffer=noiseBuf(c,1.6); const bp=c.createBiquadFilter(); bp.type="bandpass"; bp.Q.value=4; bp.frequency.setValueAtTime(260,t); bp.frequency.exponentialRampToValueAtTime(900,t+1.3);
  const g=c.createGain(); env(g,t,.12,.15,1.2); s.connect(bp).connect(g).connect(c.destination); s.start(t); s.stop(t+1.6);
  [523,659,784].forEach((f,i)=>{ const o=c.createOscillator(), og=c.createGain(); o.type="sine"; o.frequency.value=f; o.connect(og).connect(c.destination); env(og,t+.9+i*.18,.05,.02,1.4); o.start(t+.9+i*.18); o.stop(t+3); });
}
function hush(){ try{ window.speechSynthesis && speechSynthesis.cancel(); }catch(e){} }
function say(text, force){
  if(!SND.on && !force) return;
  try{
    if(!("speechSynthesis" in window)){ hint(IN_KAKAO ? "카카오톡 안에서는 읽어 주기가 안 됩니다. 위의 ‘크롬·삼성 인터넷으로 열기’를 눌러 주세요." : "이 브라우저에서는 읽어 주기를 쓸 수 없습니다. 크롬이나 삼성 인터넷으로 열어 보세요."); return; }
    speechSynthesis.cancel();
    const u=new SpeechSynthesisUtterance(text); u.lang="ko-KR"; u.rate=.9; u.pitch=.95;
    const v=speechSynthesis.getVoices().find(v=>/^ko/i.test(v.lang)); if(v) u.voice=v;
    speechSynthesis.speak(u);
  }catch(e){ hint("이 화면에서는 읽어 주기가 막혀 있습니다."); }
}
function setSound(on){
  SND.on=on; const b=$("#sndBtn"); b.setAttribute("aria-pressed", on); b.textContent = on ? "소리 켜짐" : "소리 꺼짐";
  ambient(on && S.view!=="home"); if(!on) hush();
}
const IN_KAKAO = /KAKAOTALK/i.test(navigator.userAgent);
if(IN_KAKAO){
  const k=$("#kakao"); k.hidden=false;
  $("#kakaoOpen").href = "kakaotalk://web/openExternal?url=" + encodeURIComponent(location.href);
}
$("#sndBtn").onclick=()=>{ SND.asked=true; setSound(!SND.on); };
document.addEventListener("click", e=>{ const b=e.target.closest("[data-say]"); if(!b) return; ac(); say(b.dataset.say, true); });

/* ---------- 시작 ---------- */
$("#homeBtn").onclick=()=>go("home",0);
window.claude?.hot?.snapshot?.(()=>S);
const start=d=>{ S = (d && d.view) ? Object.assign(fresh(),d) : fresh(); if(S.view==="dark"&&S.phoneOpen) S.clock=4; render(); };
window.claude?.hot?.ready ? window.claude.hot.ready(start) : start(window.claude?.hot?.data ?? {});
</script>
</body>
</html>
