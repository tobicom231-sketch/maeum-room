<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>마음의 방탈출</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hahmlet:wght@500;700;800&family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=Nanum+Pen+Script&display=swap" rel="stylesheet">
<style>
:root{
  /* 밤의 방: 짙은 청록 벽, 스탠드 불빛 같은 금빛 버튼, 휴대폰만 푸른빛 */
  --bg-top:#1a2226;
  --bg-bot:#3a4c56;
  --panel:rgba(255,255,255,.05);
  --line:rgba(255,255,255,.12);
  --ink:#f1ece2;
  --dim:#a9b3b8;
  --gold:#f2d27c;
  --gold-ink:#3a2c0c;
  --gold-soft:rgba(242,210,124,.16);
  --screen:#8fd0b5;
  --display:"Nanum Myeongjo","Noto Serif KR",serif;
  --body:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  /* 레이아웃: 위에는 늘 같은 방 그림(무대), 아래에는 지금 단계의 이야기 판 */
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:linear-gradient(180deg,var(--bg-top) 0%,#24313a 45%,var(--bg-bot) 100%) fixed;color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.65;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,[role="button"]:focus-visible{outline:2px solid var(--gold);outline-offset:3px}
.app{max-width:500px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;padding:14px 16px 16px;gap:14px}
.top{display:flex;justify-content:space-between;align-items:center;font-size:13px;color:var(--dim)}
.top b{color:var(--ink);font-weight:600}
.back{background:none;border:0;color:var(--dim);padding:6px 0;font-size:13px}
.topr{display:flex;align-items:center;gap:10px}
.snd{background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:4px 11px;font-size:12px;color:var(--dim)}
.snd[aria-pressed="true"]{color:var(--gold-ink);background:var(--gold);border-color:var(--gold)}
.say{background:none;border:1px solid var(--line);border-radius:999px;padding:3px 10px;font-size:12px;color:var(--gold);align-self:flex-start}
.choose{display:grid;grid-template-columns:1fr 1fr;gap:8px}

/* 무대 */
.stage{position:relative;border-radius:18px;border:1px solid var(--line);background:#141b1f;overflow:hidden;box-shadow:0 20px 40px -24px #000}
.stage svg{display:block;width:100%;height:auto}
.hot{cursor:pointer}
.hot .hl{opacity:0;transition:opacity .3s}
.hot:hover .hl,.hot:focus .hl{opacity:1}
.tag{font:600 9px var(--body);fill:#fff}
.tagbg{fill:rgba(10,14,16,.82);stroke:rgba(255,255,255,.25)}
.hint{margin:0 10px 10px;min-height:40px;display:flex;gap:8px;align-items:center;padding:9px 12px;border-radius:10px;background:rgba(8,12,14,.82);border:1px solid var(--line);font-size:13px;font-weight:600}
.hint::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--gold);flex:none;box-shadow:0 0 8px var(--gold)}


.phone-g.glow rect.body{filter:drop-shadow(0 0 6px #8fd0b5)}
.phone-g.buzz{animation:buzz .45s linear 4;transform-box:fill-box;transform-origin:center}
@keyframes buzz{25%{transform:rotate(-6deg)}75%{transform:rotate(6deg)}}
.pulse{animation:pulse 2s ease-in-out infinite}
@keyframes pulse{50%{opacity:.35}}
#doorPanel{transition:transform 1.4s cubic-bezier(.6,0,.2,1);transform-box:fill-box;transform-origin:left center}
.dooropen #doorPanel{transform:scaleX(.12)}
#doorLight{opacity:0;transition:opacity 1.4s}
.dooropen #doorLight{opacity:1}
#moon{transition:cx 1s,cy 1s,fill 1s}
#sky{transition:fill 1.2s}

/* 이야기 판 */
.panel{display:flex;flex-direction:column;gap:16px;padding:4px 2px}
.eyebrow{font-size:12px;letter-spacing:.16em;color:var(--gold);font-weight:700}
h1,h2{margin:0;font-weight:700;letter-spacing:-.02em;text-wrap:balance}
h1{font-size:30px;line-height:1.3}
h2{font-size:23px;line-height:1.38}
p{margin:0}
.lede{font-size:16px;color:var(--ink)}
.small{font-size:13px;color:var(--dim)}
.quote{font-family:var(--display);font-size:24px;font-weight:800;line-height:1.45}
.callout{padding:14px 16px;border-left:3px solid var(--gold);background:var(--panel);border-radius:0 10px 10px 0;font-size:15px;font-weight:600;line-height:1.7}
.narr{display:flex;flex-direction:column;gap:6px;font-family:var(--display);font-size:17px;line-height:1.8}
.narr span{opacity:0;transform:translateY(6px);animation:rise .8s ease forwards}
@keyframes rise{to{opacity:1;transform:none}}
.btn{display:block;width:100%;padding:16px 18px;border-radius:12px;border:0;background:linear-gradient(180deg,#f6dd92,var(--gold));color:var(--gold-ink);font-weight:700;font-size:16px;text-align:center;box-shadow:0 8px 20px -12px var(--gold)}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line);box-shadow:none}
.btn:disabled{opacity:.35;cursor:default}
.stack{display:flex;flex-direction:column;gap:9px}
.opt{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:13px 15px;border-radius:12px;border:1px solid var(--line);background:var(--panel);font-size:15px}
.opt[aria-pressed="true"]{border-color:var(--gold);background:var(--gold-soft)}
.opt .n{font-size:12px;color:var(--gold);min-width:16px;font-weight:700;font-variant-numeric:tabular-nums}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{padding:8px 14px;border-radius:999px;border:1px solid var(--line);background:var(--panel);font-size:14px}
.chip[aria-pressed="true"]{border-color:var(--gold);background:var(--gold-soft)}
.note{padding:14px 16px;border-radius:12px;background:#efe6cf;color:#3a3122;font-size:14px;line-height:1.7;transform:rotate(-.6deg);box-shadow:0 6px 16px -10px #000}
.note b{display:block;font-size:12px;letter-spacing:.1em;color:#8a6a2a;margin-bottom:2px}
.clues{display:flex;flex-wrap:wrap;gap:6px}
.clue{font-size:12px;padding:5px 10px;border-radius:999px;background:rgba(143,208,181,.12);color:var(--screen);border:1px solid rgba(143,208,181,.3)}

/* 휴대폰 화면 */
.chat{display:flex;flex-direction:column;gap:7px;padding:14px;border-radius:16px;background:#0e1316;border:1px solid #2a3439;font-size:14px;line-height:1.5;box-shadow:0 0 40px -18px var(--screen)}
.chat .who{font-size:12px;color:var(--dim);text-align:center;padding-bottom:6px;border-bottom:1px solid #1f282c}
.bub{max-width:84%;padding:8px 12px;border-radius:15px}
.bub.me{align-self:flex-end;background:#2f5a4c;border-bottom-right-radius:4px}
.bub.them{align-self:flex-start;background:#232b30;border-bottom-left-radius:4px}
.meta{font-size:11px;color:var(--dim);align-self:flex-end;font-variant-numeric:tabular-nums}
.meta.read{color:var(--screen)}

/* 분류 미션 */
.sortcard{padding:24px 18px;border-radius:14px;background:#efe6cf;color:#2d261a;font-family:var(--display);font-size:21px;font-weight:800;text-align:center;line-height:1.45;min-height:104px;display:flex;align-items:center;justify-content:center;box-shadow:0 10px 24px -14px #000}
.bins{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.bin{padding:13px 6px;border-radius:12px;border:1px solid var(--line);background:var(--panel);font-weight:700;font-size:15px}
.bin small{display:block;font-weight:400;font-size:11px;color:var(--dim)}
.fb{min-height:62px;padding:12px 14px;border-radius:10px;background:var(--panel);font-size:14px;border-left:3px solid var(--line)}
.fb.ok{border-left-color:var(--screen)}
.fb.miss{border-left-color:var(--gold)}
.count{font-variant-numeric:tabular-nums}

/* 장면 */
.locks{display:flex;gap:8px}
.lock{flex:1;padding:8px 4px;border-radius:10px;border:1px solid var(--line);background:var(--panel);text-align:center;font-size:12px;color:var(--dim)}
.lock b{display:block;font-size:16px;color:var(--ink)}
.lock.on{border-color:var(--gold);color:var(--gold)}
.lock.cur{outline:1px solid var(--ink);outline-offset:2px}
.scene{padding:15px 16px;border-radius:12px;background:var(--panel);border:1px solid var(--line)}
.scene .who{font-size:12px;color:var(--screen);margin-bottom:4px;font-weight:600}
.scene p{font-family:var(--display);font-size:17px;line-height:1.7;font-weight:700}

/* 결과 */
.result{padding:20px 18px;border-radius:16px;background:linear-gradient(170deg,rgba(242,210,124,.12),rgba(255,255,255,.03));border:1px solid rgba(242,210,124,.35);display:flex;flex-direction:column;gap:14px}
.meter{display:flex;flex-direction:column;gap:7px}
.meter .row{display:grid;grid-template-columns:84px 1fr 36px;align-items:center;gap:10px;font-size:14px}
.meter .bar{height:6px;border-radius:3px;background:rgba(255,255,255,.12);overflow:hidden}
.meter .bar i{display:block;height:100%;background:var(--gold);border-radius:3px}
.meter .lv{font-size:12px;color:var(--dim);text-align:right}
.insight{font-family:var(--display);font-size:19px;line-height:1.75;font-weight:800}
.chain{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:0}
.chain li{position:relative;padding:10px 14px 10px 92px;border-left:2px solid var(--gold);margin-left:8px;font-size:15px}
.chain li span{position:absolute;left:14px;top:11px;font-size:12px;color:var(--gold);font-weight:700}
.chain li+li::before{content:"↓";position:absolute;left:-9px;top:-11px;font-size:12px;color:var(--gold);background:var(--bg-top);line-height:1}
.habit{padding:16px 18px;border-radius:14px;background:#efe6cf;color:#2d261a;display:flex;flex-direction:column;gap:6px;box-shadow:0 10px 24px -14px #000}
.habit .eyebrow{color:#8a6a2a}
.habit .small{color:#6b5a3a}
.habit-name{font-family:var(--display);font-size:21px;font-weight:800}
.kakao{display:flex;flex-direction:column;gap:10px;padding:14px 16px;border-radius:12px;border:1px solid var(--gold);background:var(--gold-soft);font-size:14px}
.kakao .btn{text-decoration:none}
.kakao[hidden]{display:none}
.copyok{font-size:13px;color:var(--screen);text-align:center;min-height:18px}

/* 지도 */
.map{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.room{padding:11px 12px;border-radius:10px;border:1px solid var(--line);background:var(--panel);text-align:left;display:flex;flex-direction:column;gap:1px;min-height:70px}
.room .no{font-size:11px;color:var(--dim);font-variant-numeric:tabular-nums}
.room .nm{font-weight:700;font-size:15px}
.room .st{font-size:11px;color:var(--dim);margin-top:auto}
.room.open{border-color:var(--gold);background:var(--gold-soft)}
.room.open .st{color:var(--gold)}
.room.done .st{color:var(--screen)}
.room:disabled{cursor:default;opacity:.55}
.annex{display:flex;flex-direction:column;gap:6px;padding:14px 16px;border:1px dashed var(--line);border-radius:12px}
.annex ul{margin:0;padding-left:18px;color:var(--dim);font-size:14px}

/* 진행 */
.prog{display:flex;flex-direction:column;gap:7px;padding-top:4px}
.prog .t{font-size:13px;color:var(--dim);font-weight:600;font-variant-numeric:tabular-nums}
.prog .bar{height:3px;border-radius:2px;background:rgba(255,255,255,.14);overflow:hidden}
.prog .bar i{display:block;height:100%;background:var(--gold);transition:width .6s}
footer{font-size:12px;color:var(--dim);line-height:1.6}


/* v8 추가 */
.nums{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
.num{padding:11px 0;border-radius:10px;border:1px solid var(--line);background:var(--panel);font-family:var(--display);font-size:18px;font-weight:800}
.num[aria-pressed="true"]{border-color:var(--gold);background:var(--gold);color:var(--gold-ink)}
.card.sel{outline:3px solid var(--gold);background:#f8ecc4}
.card.sel::after{content:"골랐음";position:absolute;right:8px;bottom:6px;font-size:11px;color:#8a6a2a;font-weight:700}
details.fold summary{cursor:pointer;font-size:12px;color:var(--gold);font-weight:700;letter-spacing:.16em;padding:6px 0}
details.fold[open] summary{margin-bottom:8px}
/* v7 추가 */
.typing{align-self:flex-start;display:flex;gap:4px;padding:10px 14px;border-radius:15px;background:#232b30;border-bottom-left-radius:4px}
.typing i{width:6px;height:6px;border-radius:50%;background:var(--dim);animation:dot 1.1s infinite}
.typing i:nth-child(2){animation-delay:.18s}.typing i:nth-child(3){animation-delay:.36s}
@keyframes dot{40%{opacity:.25;transform:translateY(-3px)}}
.tstat{font-size:12px;color:var(--screen);text-align:center;min-height:18px}
.whisper{position:relative;padding:16px 18px;border-radius:14px;background:#0b0f11;border:1px solid #3b2f45;font-family:var(--display);font-size:19px;font-weight:800;line-height:1.55;color:#d9c6ec;box-shadow:0 0 30px -12px #9b6fc7}
.whisper small{display:block;font-family:var(--body);font-size:11px;letter-spacing:.14em;color:#9b84b3;margin-bottom:4px;font-weight:700}
.reply{font-size:14px;color:var(--dim);font-style:italic;min-height:22px}
.meterS{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--dim)}
.meterS b{color:#d9c6ec;font-variant-numeric:tabular-nums}
.cards{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.card{position:relative;text-align:left;padding:12px 12px 12px 14px;border-radius:12px;background:#efe6cf;color:#3a3122;font-size:13px;line-height:1.5;border:0;min-height:76px;box-shadow:0 6px 14px -10px #000}
.card b{display:block;font-size:11px;letter-spacing:.08em;color:#8a6a2a;margin-bottom:2px}
.card .dg{position:absolute;right:8px;top:6px;font-family:var(--display);font-size:18px;font-weight:800;color:#b5893a}
.card.in{background:#d9efe4;color:#1f3b2e}
.card.in::after{content:"꽂음";position:absolute;right:8px;bottom:6px;font-size:11px;color:#2f6b52;font-weight:700}
.card.no{background:#e7d9e9;color:#4a3550}
.card.no::after{content:"내가 붙인 뜻";position:absolute;right:8px;bottom:6px;font-size:11px;color:#7a4f87;font-weight:700}
.card.unk{background:var(--panel);color:var(--dim);border:1px dashed var(--line);box-shadow:none}
.keypad{display:flex;justify-content:center;gap:8px}
.keypad span{width:46px;height:56px;border-radius:10px;border:1px solid var(--line);background:#0e1316;display:flex;align-items:center;justify-content:center;font-family:var(--display);font-size:26px;font-weight:800;color:var(--gold)}
.shake{animation:shake .4s}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
textarea.line{width:100%;min-height:76px;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:#0e1316;color:var(--ink);font:inherit;font-size:15px;resize:vertical}
textarea.line:focus{outline:1px solid var(--gold)}
input[type=range]{width:100%;accent-color:var(--gold)}
.scale{display:flex;justify-content:space-between;font-size:11px;color:var(--dim)}
.big{font-family:var(--display);font-size:40px;font-weight:800;color:var(--gold);text-align:center;font-variant-numeric:tabular-nums}
.vs{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px;text-align:center}
.vs .small{display:block}
.mine{padding:12px 14px;border-radius:12px;border:1px solid rgba(242,210,124,.35);background:var(--gold-soft);font-size:15px}
.mine b{display:block;font-size:11px;color:var(--gold);letter-spacing:.1em;margin-bottom:2px}
.tcard{perspective:900px}
.tcard .in{position:relative;transition:transform .7s;transform-style:preserve-3d;min-height:330px}
.tcard.flip .in{transform:rotateY(180deg)}
.tcard .f,.tcard .b{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:18px;padding:22px 20px;display:flex;flex-direction:column;gap:10px}
.tcard .f{background:linear-gradient(160deg,#f6e7bd,#e7c977);color:#2d230d;box-shadow:0 18px 36px -20px #000}
.tcard .b{background:#141b1f;border:1px solid rgba(242,210,124,.4);transform:rotateY(180deg)}
.tcard .emo{font-size:44px;line-height:1}
.tcard .nm{font-family:var(--display);font-size:28px;font-weight:800}
.tcard .one{font-family:var(--display);font-size:17px;font-weight:800;line-height:1.6}
.tcard .f .small{color:#5a4a20}
#shadowG{transition:transform .8s cubic-bezier(.3,1.4,.5,1),opacity .8s;transform-box:fill-box;transform-origin:center bottom}
@media (prefers-reduced-motion:reduce){
  .narr span{animation:none;opacity:1;transform:none}
  .phone-g.buzz,.pulse{animation:none}
  #room,#doorPanel,#doorLight,#moon,#sky{transition:none}
}

/* ===== v9 디자인: 휴대폰 불빛으로 보는 밤 =====
   남색 밤 #0f1428 / 달빛 종이 #ebe5d6 / 문틈 호박빛 #f2b65c / 화면 민트 #8fd8c8 / 그림자 보라 #b79ae0 / 메모지 #efe3c0
   제목 Hahmlet, 본문 IBM Plex Sans KR, 손글씨(메모·속삭임) Nanum Pen Script */
:root{--bg-top:#0f1428;--bg-bot:#1a2242;--panel:rgba(190,205,255,.06);--line:rgba(190,205,255,.17);--ink:#ebe5d6;--dim:#9ea7c6;
  --gold:#f2b65c;--gold-ink:#2b1c05;--gold-soft:rgba(242,182,92,.13);--screen:#8fd8c8;--violet:#b79ae0;--paper:#efe3c0;--paper-ink:#262a4d;
  --display:"Hahmlet","Nanum Myeongjo",serif;--hand:"Nanum Pen Script","Hahmlet",cursive}
body{background:radial-gradient(130% 55% at 12% 0%,#283365 0%,rgba(40,51,101,0) 62%),linear-gradient(180deg,#0f1428,#161d3a) fixed;background-color:#0f1428;font-size:16.5px}
.app{gap:16px}
.stage{border-radius:20px;background:#0a0e20;border-color:var(--line);box-shadow:0 24px 50px -30px #000}
.hint{background:rgba(8,10,26,.86);font-weight:500;border-color:rgba(190,205,255,.12)}
.eyebrow{letter-spacing:0;font-size:13.5px;font-weight:600;color:var(--dim)}
h1{font-family:var(--display);font-weight:800;font-size:36px;line-height:1.22;letter-spacing:-.03em}
h2{font-family:var(--display);font-weight:700;font-size:24px;line-height:1.4;letter-spacing:-.02em}
.quote{font-size:26px}
.narr{font-size:18px}
.btn{background:var(--gold);border-radius:14px;box-shadow:0 0 0 1px rgba(255,236,190,.5) inset,0 14px 34px -16px var(--gold);letter-spacing:-.01em}
.btn.ghost{background:transparent;box-shadow:none;border:1px solid var(--line)}
.snd[aria-pressed="true"]{background:var(--gold);border-color:var(--gold)}
.opt{background:transparent;border-radius:14px;padding:14px 16px}
.opt[aria-pressed="true"]{background:var(--gold-soft);border-color:var(--gold)}
.opt:disabled{opacity:.45}.opt:disabled[aria-pressed="true"]{opacity:1}
.chip{background:transparent}
.callout{background:var(--panel);font-weight:500}
/* 휴대폰: 이 방의 주인공 */
.chat{position:relative;border-radius:30px;border:7px solid #05070f;background:#0a0f21;padding:0 14px 18px;gap:8px;font-size:15px;
  box-shadow:0 0 0 1px #343d6b,0 0 70px -14px rgba(143,216,200,.45)}
.chat::before{content:attr(data-t);display:block;text-align:center;font-size:11.5px;color:var(--dim);padding:9px 0 2px;font-variant-numeric:tabular-nums}
.chat .who{font-size:14px;font-weight:600;color:var(--ink);padding:4px 0 10px;border-bottom:1px solid #1d2546;margin-bottom:6px}
.bub{border-radius:18px;padding:9px 13px}
.bub.me{background:#2b5d55;border-bottom-right-radius:5px}
.bub.them{background:#222a4a;border-bottom-left-radius:5px}
.typing{background:#222a4a;border-radius:18px;border-bottom-left-radius:5px;padding:12px 15px}
.typing i{background:var(--screen)}
.tstat{font-size:13px}
/* 고르는 문장은 말풍선 모양: 상대가 지운 말(왼쪽, 점선) / 내가 보낼 말(오른쪽) */
#gt.stack{align-items:flex-start}
#gt .opt{width:auto;max-width:90%;background:#1b2240;border:1.5px dashed rgba(190,205,255,.3);border-radius:18px 18px 18px 5px;color:var(--dim)}

/* 단서는 메모지 */
.cards{gap:12px 10px;padding:4px 2px}
.card{background:var(--paper);color:var(--paper-ink);border-radius:3px;font-family:var(--hand);font-size:21px;line-height:1.22;padding:10px 26px 14px 12px;min-height:92px;box-shadow:0 10px 18px -12px #000;transition:transform .2s}

.card.no{background:#ddd0e6;color:#43345a}

.fb{background:var(--panel);border-radius:0 10px 10px 0}

/* 결과 카드: 수집용 카드 한 장 */

/* ===== v10 입체 방: CSS 3D 상자 + 시점 이동 ===== */

  background:repeating-linear-gradient(90deg,rgba(0,0,0,.22) 0 1px,transparent 1px 45px),linear-gradient(0deg,#4a3f5c,#2d2948)}

    <p class="eyebrow">방 2 · 입구</p>
    <p class="quote">침묵은 사실일까, 해석일까.</p>
    <div class="narr">${ENTER_LINES.map((l,i)=>`<span style="animation-delay:${.3+i*.8}s">${l}</span>`).join("")}</div>
    <button class="btn" type="button" id="next">불을 켜고 들어간다</button>`;
  say("침묵은 사실일까, 해석일까. " + ENTER_LINES.join(" "));
  $("#next").onclick = () => { hush(); go("dark",2); };
}

/* ---------- 2. 입력 중… ---------- */
function chatHTML(opt={}){
  const v=VV();
  let h=`<div class="chat" data-t="${opt.reply?v.replyT:v.times[Math.min(S.clock,4)].replace(" 읽음","")}"><div class="who">${v.who}</div>
    <div class="bub them">${v.prev}</div>
    <div class="bub me">${v.sent}</div>
    <div class="meta read">읽음 ${v.read}</div>`;
  if(opt.typing) h+=`<div class="typing" aria-label="입력 중"><i></i><i></i><i></i></div>`;
  if(opt.mySent) h+=`<div class="bub me">${esc(opt.mySent)}</div>`;
  if(opt.reply){ h+=opt.reply.map(t=>`<div class="bub them">${esc(t)}</div>`).join("")+`<div class="meta">${v.replyT}</div>`; }
  return h+`</div>`;
}
function clockText(){ const t=VV().times; const k=Math.min(S.clock,4); return k===0 ? t[0] : `${t[k]} · 아직 답이 없습니다`; }
function dark(){
  const v=VV(), started=S.clock>0, ready=S.typed>=2 && !S.typingNow;
  hint(started? (S.typingNow?`${v.who} 님이 입력 중…`:"화면을 지켜보세요.") : "빛나는 휴대전화를 눌러 보세요.");
  V().innerHTML = `
    <p class="eyebrow">입력 중…</p>
    <h2>${started?"화면에서 눈을 뗄 수가 없습니다.":"책상 위 휴대전화가 빛납니다."}</h2>
    ${started?chatHTML({typing:S.typingNow})+`<p class="tstat" id="tstat">${S.typingNow?`${v.who} 님이 입력 중…`:(S.typed?`입력 중 표시가 사라졌습니다 · ${clockText()}`:clockText())}</p>`:`<button class="btn" type="button" id="peek">휴대전화 보기</button>`}
    ${ready?`
      <div class="whisper" style="border-color:var(--line);box-shadow:none;color:var(--ink)"><small>질문</small>${esc(jo(v.who,"은","는"))} 방금 무엇을 쓰다가 지웠을까요?</div>
      <div class="stack" id="gt">${DELETED.map((d,i)=>`<button class="opt" type="button" data-i="${i}" aria-pressed="${S.guessType===d.t}">“${d.t}”</button>`).join("")}</div>
      <button class="btn" type="button" id="next" ${!S.guessType?"disabled":""}>다음</button>`:""}`;
  if(!started){ $("#peek").onclick=runPhone; return; }
  if(ready){
    $("#gt").onclick=e=>{ const b=e.target.closest("[data-i]"); if(!b) return; S.guessType=DELETED[+b.dataset.i].t; keepY(dark); };
    $("#next").onclick=()=>go("first",2);
  }
}
async function runPhone(){
  S.clock=1; dark(); syncStage(); ticks(2);
  const step = async (typeMs) => {
    await wait(1500); if(S.view!=="dark") return false;
    S.typingNow=true; dark(); typeSnd(); await wait(typeMs); if(S.view!=="dark") return false;
    S.typingNow=false; S.typed++; S.clock++; dark(); syncStage(); ticks(1); return true;
  };
  if(!await step(2400)) return;
  if(!await step(1200)) return;
  await wait(800); if(S.view!=="dark") return; S.clock=4; syncStage(); dark();
  say(`입력 중 표시가 사라졌습니다. ${jo(VV().who,"은","는")} 무엇을 쓰다 지웠을까요?`);
}
function first(){
  hint("가장 먼저 떠오른 생각을 고르세요.");
  V().innerHTML = `
    <p class="eyebrow">입력 중… · 첫 생각</p>
    <h2>이 침묵, 무슨 뜻 같나요?</h2>
    <div class="stack" id="opts">${FIRST.map((o,i)=>`<button class="opt" type="button" aria-pressed="${S.first===i}" data-i="${i}"><span class="n">${i+1}</span>${o.t}</button>`).join("")}</div>
    <p class="eyebrow">지금 올라오는 감정 (여러 개 가능)</p>
    <div class="chips" id="feel">${FEEL.map((f,i)=>`<button class="chip" type="button" aria-pressed="${S.feel.includes(i)}" data-i="${i}">${f.t}</button>`).join("")}</div>
    <p class="eyebrow">마음이 얼마나 흔들리나요?</p>
    ${nums("before",S.before)}
    <button class="btn" type="button" id="next" ${S.first===null||!S.feel.length||S.before===null?"disabled":""}>방 구석에서 무언가 움직인다</button>`;
  const pick = fn => e => { const b=e.target.closest("button"); if(!b) return; keepY(()=>{ fn(b); first(); }); };
  $("#opts").onclick = pick(b => { S.first=+b.dataset.i; });
  $("#feel").onclick = pick(b => { const i=+b.dataset.i; S.feel = S.feel.includes(i)? S.feel.filter(x=>x!==i) : [...S.feel,i]; });
  $("#before").onclick = pick(b => { S.before=+b.dataset.n; });
  $("#next").onclick = () => { S.wi=0; S.wback=null; go("whisper",3); setTimeout(()=>say(WHISPER[grp()][0]),300); };
}

/* ---------- 3. 속삭이는 목소리 ---------- */
const wPick = k => S.wlog.map((j,r)=>COMEBACK[r][j]).filter(c=>k==="up"?c.d>0:k==="down"?c.d<0:c.d===0).length;
function whisper(){
  const lines=WHISPER[grp()], i=S.wi;
  if(i>=lines.length){
    const beat=wPick("down"), agree=wPick("up");
    hint("그림자가 방 구석에 웅크립니다.");
    V().innerHTML = `
      <p class="eyebrow">속삭이는 목소리</p>
      <h2>${beat===3?"그림자가 작아졌습니다.":agree>=2?"그림자가 방을 반쯤 덮었습니다.":"그림자는 아직 방 구석에 있습니다."}</h2>
      <p class="lede">${beat===3?"세 번 모두 맞받아쳤습니다. 속삭임은 아직 들리지만, 더는 크게 들리지 않습니다.":agree>=2?"속삭임에 고개를 끄덕였습니다. 밤에는 누구나 그럴 때가 있습니다.":"맞받아친 말도 있고, 피하거나 끄덕인 말도 있습니다."}</p>
      <p class="small">이제 방을 뒤져 단서를 찾을 차례입니다. 문에는 네 자리 번호 자물쇠가 걸려 있습니다.</p>
      <button class="btn" type="button" id="next">방을 뒤진다</button>`;
    $("#next").onclick=()=>go("search",4);
    return;
  }
  const opts=COMEBACK[i];
  hint("그림자가 속삭입니다. 뭐라고 대꾸하겠습니까?");
  V().innerHTML = `
    <p class="eyebrow">속삭이는 목소리 · ${i+1} / ${lines.length}</p>
    <div class="whisper"><small>방 구석의 그림자</small>“${lines[i]}”</div>
    <div class="stack" id="opts">${opts.map((c,j)=>`<button class="opt" type="button" data-j="${j}" ${S.wback!==null?"disabled":""} aria-pressed="${S.wback===j}">${c.t}</button>`).join("")}</div>
    <p class="reply" id="rep">${S.wback!==null?"그림자: “"+esc(opts[S.wback].back)+"”":""}</p>
    ${S.wback!==null?`<button class="btn ghost" type="button" id="wn">${i+1<lines.length?"그림자가 다시 입을 연다":"그림자가 입을 다문다"}</button>`:""}`;
  if(S.wback!==null){ $("#wn").onclick=()=>{ S.wi++; S.wback=null; whisper(); syncStage(); const nx=lines[S.wi]; if(nx) say(nx); window.scrollTo(0,0); }; return; }
  $("#opts").onclick=e=>{ const b=e.target.closest("[data-j]"); if(!b) return; const j=+b.dataset.j, c=opts[j];
    S.wback=j; S.wlog.push(j); S.shadow=Math.max(0,Math.min(6,S.shadow+c.d));
    whisper(); syncStage(); c.d<0?chime():lowBuzz(); say(c.back); };
}

/* ---------- 4. 단서와 자물쇠 ---------- */
function search(){
  const C=CARDS(), allFound=C.every(c=>S.found.includes(c.o));
  const shown=S.order.map(i=>C[i]);
  if(S.opened){
    const code=shown.filter(c=>c.a==="f").map(c=>c.dg).join("");
    hint("딸깍. 자물쇠가 풀립니다.");
    V().innerHTML = `
      <p class="eyebrow">단서와 자물쇠</p>
      <h2>${S.tries?`${S.tries+1}번 만에 자물쇠가 풀렸습니다.`:"한 번에 자물쇠가 풀렸습니다."}</h2>
      <div class="keypad">${[...code].map(d=>`<span>${d}</span>`).join("")}</div>
      <p class="lede">문을 연 건 누가 봐도 똑같이 확인되는 네 가지뿐이었습니다. 읽었다, 답이 없다, 그리고 서랍과 쪽지에 적힌 일.</p>
      <div class="cards">${shown.filter(c=>c.a==="g").map(c=>`<div class="card no"><b>${c.k}</b>${esc(c.t)}</div>`).join("")}</div>
      <p class="small">남은 세 장은 사실처럼 적혀 있었지만, 확인된 적 없는 문장입니다. 밤이 붙인 뜻입니다.${S.wrongN?` 당신은 그중 일부를 번호에 넣어 봤습니다. 밤에는 추측이 사실처럼 보입니다.`:""}</p>
      <button class="btn" type="button" id="next">휴대전화를 다시 든다</button>`;
    $("#next").onclick=()=>go("write",5);
    return;
  }
  const sel=shown.filter(c=>S.sel.includes(c.i));
  hint(allFound?"문에 새겨진 글: “확인된 것만 이 문을 연다.”":"방 안의 물건을 눌러 단서를 찾으세요.");
  V().innerHTML = `
    <p class="eyebrow">단서와 자물쇠 · ${allFound?`시도 ${S.tries+1}번째`:`찾은 단서 <span class="count">${S.found.length}</span> / ${C.length}`}</p>
    <h2>${allFound?"확인된 사실 네 장을 고르세요.":"방을 뒤지세요."}</h2>
    <p class="small">${allFound?"카드마다 숫자가 하나씩 있습니다. 고른 네 장의 숫자가 비밀번호가 됩니다. 일곱 장 중 세 장은 사실이 아닙니다.":"위 그림의 물건을 누르거나, 아래 이름을 누르세요."}</p>
    ${allFound?"":`<div class="chips" id="objs">${C.map(c=>`<button class="chip" type="button" data-o="${c.o}" aria-pressed="${S.found.includes(c.o)}">${c.n}</button>`).join("")}</div>`}
    <div class="cards" id="cards">${shown.map(c=>{
      if(!S.found.includes(c.o)) return `<div class="card unk"><b>?</b>아직 찾지 못함</div>`;
      const mark = S.tries>=4 && c.a==="g";
      return `<button class="card ${S.sel.includes(c.i)?"sel":""} ${mark?"no":""}" type="button" data-i="${c.i}" ${(!allFound||mark)?"disabled":""}><b>${c.k}</b>${esc(c.t)}<span class="dg">${c.dg}</span></button>`;}).join("")}</div>
    ${allFound?`<div class="keypad" id="kp">${[0,1,2,3].map(n=>`<span>${sel[n]?sel[n].dg:"·"}</span>`).join("")}</div>
      <button class="btn" type="button" id="tryBtn" ${S.sel.length!==4?"disabled":""}>이 번호로 문을 연다</button>`:""}
    <div class="fb ${S.tries?"miss":""}" id="fb">${S.lastFb||(allFound?"네 장을 고르면 번호가 만들어집니다.":"물건마다 단서가 하나씩 숨어 있습니다.")}</div>`;
  const ob=$("#objs"); if(ob) ob.onclick=e=>{ const b=e.target.closest("[data-o]"); if(b) find(b.dataset.o); };
  if(allFound){
    $("#cards").onclick=e=>{ const b=e.target.closest("[data-i]"); if(!b||b.disabled) return; const i=+b.dataset.i;
      if(S.sel.includes(i)) S.sel=S.sel.filter(x=>x!==i); else if(S.sel.length<4){ S.sel.push(i); ticks(1); } else { S.lastFb="네 장까지만 고를 수 있습니다. 바꾸려면 고른 카드를 다시 눌러 빼세요."; }
      keepY(search); syncStage(); };
    $("#tryBtn").onclick=tryOpen;
  }
}
function find(o){
  const C=CARDS(), c=C.find(x=>x.o===o);
  if(!c){ hint(OBJ_TEXT[o]||""); return; }
  if(C.every(x=>S.found.includes(x.o))) return;
  if(!S.found.includes(o)){ S.found.push(o); chime(); }
  S.lastFb=`<b>${c.k}</b> · ${esc(c.t)}`;
  if(C.every(x=>S.found.includes(x.o))) S.lastFb="단서 일곱 장을 모두 찾았습니다. 이제 확인된 사실 네 장을 고르세요.";
  keepY(search); hint(`${c.n}에서 단서를 찾았습니다.`);
}
function tryOpen(){
  const C=CARDS(), g=S.sel.filter(i=>C[i].a==="g").length;
  if(g===0){ S.opened=true; chime(); setTimeout(chime,250); S.lastFb=""; search(); syncStage(); window.scrollTo(0,0); return; }
  S.tries++; S.wrongN+=g; S.shadow=Math.min(6,S.shadow+1); lowBuzz();
  S.lastFb=`덜컹. 열리지 않습니다. 네 장 중 <b>${g}장</b>은 확인된 사실이 아닙니다. 그림자가 킥킥 웃습니다.`
    + (S.tries===2?" <br>힌트: 다른 사람이 이 방에 들어와도 똑같이 볼 수 있는 것만 사실입니다.":"")
    + (S.tries>=4?" <br>사실이 아닌 카드를 표시해 두었습니다.":"");
  if(S.tries>=4) S.sel=S.sel.filter(i=>C[i].a==="f");
  keepY(search); syncStage();
  const s=$("#stage"); s.classList.remove("shake"); void s.offsetWidth; s.classList.add("shake");
}

/* ---------- 5. 보낼 한 줄 ---------- */
function write(){
  const v=VV();
  hint(`${v.last}. 아직 답이 없습니다.`);
  V().innerHTML = `
    <p class="eyebrow">보낼 한 줄 · ${v.last}</p>
    <h2>지금 ${esc(v.who)}에게 한 줄 보낸다면?</h2>

    <div class="stack" id="ln">${LINES.map((l,i)=>`<button class="opt" type="button" data-i="${i}" aria-pressed="${S.line===l.t}">“${l.t}”</button>`).join("")}</div>
    <p class="eyebrow">그리고, 어떻게 하겠습니까?</p>

}

/* ---------- 6. 다음 날 아침 ---------- */

    <p class="eyebrow">다음 날 아침</p>

    <div class="mine"><b>어젯밤 당신이 떠올린, ${esc(jo(v.who,"이","가"))} 쓰다 지운 말</b>“${esc(S.guessType)}”</div>
    <p class="eyebrow">답장을 읽은 지금, 마음은 얼마나 흔들리나요?</p>
    ${nums("after",S.after)}
    ${S.after!==null?`
      <div class="vs"><div><span class="small">어젯밤</span><span class="big">${S.before}</span></div><div class="small">→</div><div><span class="small">지금</span><span class="big">${S.after}</span></div></div>
      <p class="lede">${diff>=3?"바뀐 건 사실 하나뿐인데, 마음의 숫자가 이만큼 움직였습니다.":diff<=0?"답장을 받고도 마음이 가라앉지 않았습니다. 그것도 단서입니다. 이 침묵이 건드린 건 이번 일만이 아닐 수 있습니다.":"마음이 조금 움직였습니다."}</p>
      <div class="callout">${v.lesson}</div>
      <button class="btn" type="button" id="next">문으로 걸어간다</button>`:""}`;
  $("#after").onclick=e=>{ const b=e.target.closest("[data-n]"); if(!b) return; const was=S.after; S.after=+b.dataset.n; keepY(reveal); if(was===null) say(v.lesson); };
  const nx=$("#next"); if(nx) nx.onclick=()=>{ hush(); go("mine",7); };
}

/* ---------- 7. 역할 반전: 당신의 침묵 ---------- */

  const none = S.mineRel===RELS.length-1, m=MINE[S.mine], who=mineWho();

  let h=`
    <p class="eyebrow">당신의 침묵</p>
    <h2>문고리를 잡는 순간, 질문 하나가 문에 떠오릅니다.</h2>
    <div class="whisper" style="border-color:var(--line);box-shadow:none;color:var(--ink)"><small>문에 새겨진 질문</small>요즘 당신이 답을 미루고 있는 사람이 있나요?</div>
    <div class="chips" id="rel">${RELS.map((r,i)=>`<button class="chip" type="button" data-i="${i}" aria-pressed="${S.mineRel===i}">${r}</button>`).join("")}</div>`;

    h+= none ? `

      <p class="small">${m.ago}에 읽고, 답하지 않은 메시지입니다.</p>` : `
      <p class="lede">지금 그 사람의 휴대폰 화면은 이렇습니다.</p>
      <div class="chat" data-t="지금"><div class="who">받는 사람: 나</div><div class="bub me">(그 사람이 당신에게 보낸 메시지)</div><div class="meta read">읽음</div><div class="meta">아직 답이 없습니다</div></div>
      <p class="small">어젯밤 당신이 보던 화면과 똑같습니다. 자리만 바뀌었습니다.</p>`;

function score(){
  let rej=0, mind=0, anx=0;
  const f=FIRST[S.first]; rej+=f.rej||0; mind+=f.mind||0; anx+=f.anx||0;
  let fr=0, fa=0; S.feel.forEach(i=>{fr+=FEEL[i].rej||0; fa+=FEEL[i].anx||0;}); rej+=Math.min(2,fr); anx+=Math.min(2,fa);
  [tagOf(DELETED,S.guessType), tagOf(LINES,S.line), tagOf(READS,S.mineRead)].forEach(t=>{ rej+=t.rej||0; anx+=t.anx||0; if(t.rej||t.anx) mind+=1; });
  const agree=wPick("up"); mind+=agree; if(grp()==="분노"||grp()==="우울") rej+=agree; else anx+=agree;
  mind+=Math.min(3,S.wrongN);
  const a=ACTIONS[S.act]; rej+=a.rej||0; anx+=a.anx||0;
  if(S.before>=7) anx+=1; if(S.before>=9) anx+=1;
  const cap=(v,m)=>Math.min(1,v/m);
  return [["거절 민감",cap(rej,10)],["마음 읽기",cap(mind,11)],["관계 불안",cap(anx,11)]];
}

const SND = {on:false, asked:false, ctx:null, amb:null};
function ac(){ try{ if(!SND.ctx) SND.ctx = new (window.AudioContext||window.webkitAudioContext)(); if(SND.ctx.state==="suspended") SND.ctx.resume(); return SND.ctx; }catch(e){ return null; } }
function env(g, t, peak, a, d){ g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(peak,t+a); g.gain.exponentialRampToValueAtTime(0.0001,t+a+d); }
function noiseBuf(c, sec){ const b=c.createBuffer(1, c.sampleRate*sec, c.sampleRate), d=b.getChannelData(0); for(let i=0;i<d.length;i++) d[i]=Math.random()*2-1; return b; }
function ambient(on){
  const c=ac(); if(!c) return;
  if(on && !SND.amb){
    const src=c.createBufferSource(); src.buffer=noiseBuf(c,3); src.loop=true;
    const lp=c.createBiquadFilter(); lp.type="lowpass"; lp.frequency.value=320;
    const g=c.createGain(); g.gain.value=0.0001; g.gain.exponentialRampToValueAtTime(0.035,c.currentTime+2);
    const hum=c.createOscillator(); hum.frequency.value=55; const hg=c.createGain(); hg.gain.value=0.012;
    src.connect(lp).connect(g).connect(c.destination); hum.connect(hg).connect(g);
    src.start(); hum.start(); SND.amb={src,hum,g};
  } else if(!on && SND.amb){
    const {src,hum,g}=SND.amb; g.gain.exponentialRampToValueAtTime(0.0001,c.currentTime+.6);
    setTimeout(()=>{ try{src.stop();hum.stop();}catch(e){} },700); SND.amb=null;
  }
}
function ticks(n){
  if(!SND.on) return; const c=ac(); if(!c) return;
  for(let i=0;i<n;i++){ const t=c.currentTime+i*.5, o=c.createOscillator(), g=c.createGain(); o.type="square"; o.frequency.value=i%2?1500:1900; o.connect(g).connect(c.destination); env(g,t,.05,.002,.04); o.start(t); o.stop(t+.06); }
}
function typeSnd(){
  if(!SND.on) return; const c=ac(); if(!c) return;
  for(let i=0;i<7;i++){ const t=c.currentTime+i*.16+Math.random()*.05, s=c.createBufferSource(), hp=c.createBiquadFilter(), g=c.createGain(); s.buffer=noiseBuf(c,.03); hp.type="highpass"; hp.frequency.value=2500; s.connect(hp).connect(g).connect(c.destination); env(g,t,.04,.002,.02); s.start(t); }
}
function lowBuzz(){
  if(!SND.on) return; const c=ac(); if(!c) return; const t=c.currentTime;
  const o=c.createOscillator(), g=c.createGain(); o.type="triangle"; o.frequency.setValueAtTime(110,t); o.frequency.exponentialRampToValueAtTime(70,t+.5); o.connect(g).connect(c.destination); env(g,t,.12,.02,.5); o.start(t); o.stop(t+.6);
}
function buzz(){
  if(!SND.on) return; const c=ac(); if(!c) return;
  for(let i=0;i<3;i++){ const t=c.currentTime+i*.42, o=c.createOscillator(), lp=c.createBiquadFilter(), g=c.createGain(); o.type="sawtooth"; o.frequency.value=150; lp.type="lowpass"; lp.frequency.value=600; o.connect(lp).connect(g).connect(c.destination); env(g,t,.16,.01,.28); o.start(t); o.stop(t+.32); }
}
function chime(){
  if(!SND.on) return; const c=ac(); if(!c) return; const t=c.currentTime;
  [880,1320].forEach((f,i)=>{ const o=c.createOscillator(), g=c.createGain(); o.type="sine"; o.frequency.value=f; o.connect(g).connect(c.destination); env(g,t+i*.08,.07,.01,.9); o.start(t+i*.08); o.stop(t+1.1); });
}
function door(){
  if(!SND.on) return; const c=ac(); if(!c) return; const t=c.currentTime;
  const s=c.createBufferSource(); s.buffer=noiseBuf(c,1.6); const bp=c.createBiquadFilter(); bp.type="bandpass"; bp.Q.value=4; bp.frequency.setValueAtTime(260,t); bp.frequency.exponentialRampToValueAtTime(900,t+1.3);
  const g=c.createGain(); env(g,t,.12,.15,1.2); s.connect(bp).connect(g).connect(c.destination); s.start(t); s.stop(t+1.6);
  [523,659,784].forEach((f,i)=>{ const o=c.createOscillator(), og=c.createGain(); o.type="sine"; o.frequency.value=f; o.connect(og).connect(c.destination); env(og,t+.9+i*.18,.05,.02,1.4); o.start(t+.9+i*.18); o.stop(t+3); });
}

function score(){

  add(THINK[S.think]); add(FIRST[S.first]); add(GOOD[S.good]); add(ACTS[S.act]);
  filt+=S.more+Math.min(2,S.wi); rank+=Math.min(2,S.wd);
  if(S.before>=7) eras+=1; if(S.before>=9) rank+=1;
  const cap=(v,m)=>Math.min(1,v/m);
  return [["걸러 보기",cap(filt,10)],["줄 세우기",cap(rank,7)],["내 것 지우기",cap(eras,7)]];

  found:[], sl:[2,2,2], tries:0, opened:false, lastFb:"", act:null, after:null, left:null, whyx:null, flip:false}; }
const VV = () => VAR[S.v];
const ties = () => S.tie.filter(Boolean).length;
function pick(){ const seen=store("maeum.left.seen")||[]; let pool=VAR.map((_,i)=>i).filter(i=>!seen.includes(i));
  if(!pool.length){ pool=VAR.map((_,i)=>i).filter(i=>i!==seen[seen.length-1]); store("maeum.left.seen",[]); }
  S.v=pool[Math.floor(Math.random()*pool.length)]; }
function start(){ S=fresh5(); a_exit.spoken=false; a_moment.running=false; pick(); mount(5); go("a_enter",1); }

function sync(){
  const st=$("#stage"), v=S.view;
  st.classList.toggle("lightsoff", v==="a_enter");
  st.classList.toggle("dooropen", v==="a_exit");
  st.classList.toggle("morning", ["a_next","a_mine","a_exit"].includes(v));
  st.dataset.view=v;
  [...$("#locks").children].forEach((c,i)=>c.setAttribute("fill", S.opened||(S.tries>=3&&S.sl[i]===0) ? "#f2d27c" : "#2a1a0e"));
  $("#phoneDot").style.display = (v==="a_moment"&&S.beat<0) ? "" : "none";
  const show = !S.opened;
  ["t5a","t5b","t5c"].forEach((id,i)=>{ $("#"+id).setAttribute("opacity", show&&S.tie[i]?1:0); });
  const n=ties(); const nl=$("#neul5"); nl.setAttribute("opacity", show&&n?1:0); nl.setAttribute("font-size", 18+n*8);
}
function screenHTML(){
  const v=VV();
  return `<div class="chat" data-t="${v.time}"><div class="who">${v.title}</div>${v.screen.map(b=>`<div class="bub ${b.me?"me":"them"}">${b.who?`<small style="display:block;font-size:11px;color:var(--dim)">${b.who}</small>`:""}${esc(b.t)}</div>`).join("")}</div>`;
}
function a_enter(){
  hint("방이 어둡습니다. 의자 하나가 비어 있습니다.");
  if(!SND.asked){
    V().innerHTML=`<p class="eyebrow">방 5 · 입구</p><p class="quote">빈자리는 사실일까, 버려짐일까.</p>
      <p class="lede">이 방에는 소리와 나레이션이 있습니다.</p>
      <div class="choose"><button class="btn" type="button" id="sOn">소리와 함께</button><button class="btn ghost" type="button" id="sOff">조용히</button></div>`;
    $("#sOn").onclick=()=>{ SND.asked=true; setSound(true); a_enter(); };
    $("#sOff").onclick=()=>{ SND.asked=true; setSound(false); a_enter(); };
    return;
  }
  const L=["내가 없는 자리에서,","사람들이 웃고 있습니다.","벽에는 오래된 사진들이 걸려 있습니다.","붉은 실 한 타래가 바닥에 놓여 있습니다."];
  V().innerHTML=`<p class="eyebrow">방 5 · 입구</p><p class="quote">빈자리는 사실일까, 버려짐일까.</p>
    <div class="narr">${L.map((l,i)=>`<span style="animation-delay:${.3+i*.8}s">${l}</span>`).join("")}</div>
    <button class="btn" type="button" id="next">불을 켜고 들어간다</button>`;
  say("빈자리는 사실일까, 버려짐일까. "+L.join(" "));
  $("#next").onclick=()=>{ hush(); go("a_moment",2); };
}
function a_moment(){
  const v=VV(), started=S.beat>=0, done=S.beat>=v.beat.length-1 && !a_moment.running;
  hint(started?"화면에서 눈을 뗄 수가 없습니다.":"빛나는 휴대전화를 눌러 보세요.");
  V().innerHTML=`<p class="eyebrow">빈자리</p>
    <h2>${started?esc(v.intro):"식탁 위 휴대전화가 빛납니다."}</h2>
    ${started?screenHTML()+`<p class="tstat">${v.beat[Math.min(S.beat,v.beat.length-1)]}</p>`:`<button class="btn" type="button" id="peek">휴대전화 보기</button>`}
    ${done?`<div class="whisper" style="border-color:var(--line);box-shadow:none;color:var(--ink)"><small>질문</small>왜 나는 그 자리에 없었을까요?</div>
      <div class="chips" id="think">${THINK.map((t,i)=>`<button class="chip" type="button" data-i="${i}" aria-pressed="${S.think===i}">${t.t}</button>`).join("")}</div>
      <button class="btn" type="button" id="next" ${S.think===null?"disabled":""}>다음</button>`:""}`;
  if(!started){ $("#peek").onclick=runBeat; return; }
  if(done){ $("#think").onclick=e=>{ const b=e.target.closest("[data-i]"); if(!b) return; S.think=+b.dataset.i; keepY(a_moment); };
    $("#next").onclick=()=>go("a_first",2); }
}
async function runBeat(){
  if(a_moment.running) return; a_moment.running=true; const v=VV();
  for(let i=0;i<v.beat.length;i++){ S.beat=i; if(S.view!=="a_moment") break; a_moment(); sync(); ticks(1); await wait(1100); }
  a_moment.running=false; if(S.view==="a_moment"){ a_moment(); lowBuzz(); say(v.intro+" 왜 나는 그 자리에 없었을까요?"); }
}
function a_first(){
  hint("가장 먼저 떠오른 생각을 고르세요.");

    <div class="stack" id="opts">${FIRST.map((o,i)=>`<button class="opt" type="button" aria-pressed="${S.first===i}" data-i="${i}"><span class="n">${i+1}</span>${o.t}</button>`).join("")}</div>
    <p class="eyebrow">마음이 얼마나 텅 빈 것 같나요?</p>
    ${nums("before",S.before).replace("10 · 아무것도 손에 안 잡힌다","10 · 텅 비었다")}
    <button class="btn" type="button" id="next" ${S.first===null||S.before===null?"disabled":""}>벽의 사진들이 흔들린다</button>`;
  $("#opts").onclick=e=>{ const b=e.target.closest("[data-i]"); if(!b) return; S.first=+b.dataset.i; keepY(a_first); };
  $("#before").onclick=e=>{ const b=e.target.closest("[data-n]"); if(!b) return; S.before=+b.dataset.n; keepY(a_first); };
  $("#next").onclick=()=>{ go("a_memory",3); say("벽에 걸린 오래된 사진이 눈에 들어옵니다. "+MEM[0]); };
}
function a_memory(){
  if(S.mi>=MEM.length){
    const n=ties();
    hint(n?"붉은 실 끝에 글자 하나가 매달렸습니다.":"실타래는 바닥에 그대로 있습니다.");
    V().innerHTML=`<p class="eyebrow">기억의 실</p>

      <p class="lede">${n===0?"오래된 일은 오래된 일로, 오늘 일은 오늘 일로 따로 두었습니다.":"실 끝에 ‘늘’이라는 글자가 매달렸습니다. 엮을수록 글자가 커집니다."}</p>
      ${n?`<p class="small">열두 살의 운동장, 스무 살의 친구, 작년의 생일. 사람도, 사정도, 해도 서로 달랐습니다. 같은 것은 그때마다 느낀 마음뿐입니다.</p>`:""}
      <p class="small">이제 방을 뒤져, 오늘 실제로 무슨 일이 있었는지 찾아볼 차례입니다.</p>
      <button class="btn" type="button" id="next">방을 뒤진다</button>`;
    $("#next").onclick=()=>go("a_search",4);
    return;
  }
  hint("벽의 오래된 사진 한 장이 눈에 들어옵니다.");
  V().innerHTML=`<p class="eyebrow">기억의 실 · ${S.mi+1} / ${MEM.length}</p>
    <h2>오래된 사진 한 장이 떠오릅니다.</h2>
    <div class="cards" style="grid-template-columns:1fr"><div class="card" style="min-height:0;transform:rotate(-.6deg)"><b>벽에 걸린 사진</b>${esc(MEM[S.mi])}</div></div>
    <p class="small">손에 붉은 실이 들려 있습니다. 이 사진을 오늘 일과 엮을 수 있습니다.</p>
    <div class="choose">
      <button class="btn ghost" type="button" id="tie">오늘 일과 엮는다</button>
      <button class="btn ghost" type="button" id="apart">따로 둔다</button>
    </div>`;
  const nx=t=>{ S.tie[S.mi]=t; S.mi++; t?lowBuzz():ticks(1); a_memory(); sync(); if(S.mi<MEM.length) say(MEM[S.mi]); };
  $("#tie").onclick=()=>nx(true); $("#apart").onclick=()=>nx(false);
}
function sentence(v, arr, tap){
  return `<div class="sent" id="sent">${[0,1,2].map(i=>tap?`<button class="slot ${S.tries>=3&&arr[i]===0?"ok":""}" type="button" data-i="${i}">${v.slots[i][arr[i]]}</button>`:`<span class="slot ok">${v.slots[i][arr[i]]}</span>`).join(" ")}</div>`;
}
function a_search(){
  const v=VV(), all=OBJS.every(o=>S.found.includes(o[0]));
  if(S.opened){
    hint("딸깍. 문장이 맞았습니다. 벽의 실이 풀립니다.");
    V().innerHTML=`<p class="eyebrow">증거와 문장</p>
      <h2>${S.tries?`${S.tries+1}번 만에 문이 열렸습니다.`:"한 번에 문이 열렸습니다."}</h2>
      ${sentence(v,[0,0,0],false)}
      <p class="lede">문에는 처음에 “${v.slots[0][2]} ${v.slots[1][2]} ${v.slots[2][2]}”라고 적혀 있었습니다. 밤이 써 놓은 문장입니다. 문을 연 건 방에서 확인한 대로 적은 문장이었습니다.</p>
      <p class="small">빈자리는 그대로입니다. 달라진 건 문장뿐입니다.</p>
      <button class="btn" type="button" id="next">이제 어떻게 할지 정한다</button>`;
    $("#next").onclick=()=>go("a_act",5);
    return;
  }
  hint(all?"문에 새겨진 글: “있는 그대로 적은 문장만 이 문을 연다.”":"방 안의 물건을 눌러 증거를 찾으세요.");
  V().innerHTML=`<p class="eyebrow">증거와 문장 · ${all?`시도 ${S.tries+1}번째`:`찾은 증거 <span class="count">${S.found.length}</span> / ${OBJS.length}`}</p>
    <h2>${all?"문에 적힌 문장을 고쳐 쓰세요.":"방을 뒤지세요."}</h2>
    <p class="small">${all?"밑줄 친 말을 누르면 다른 말로 바뀝니다. 방에서 확인한 대로만 적으세요.":"위 그림의 물건을 누르거나, 아래 이름을 누르세요."}</p>
    ${all?"":`<div class="chips" id="objs">${OBJS.map(o=>`<button class="chip" type="button" data-o="${o[0]}" aria-pressed="${S.found.includes(o[0])}">${o[1]}</button>`).join("")}</div>`}
    ${all?sentence(v,S.sl,true)+`<button class="btn" type="button" id="tryBtn">이 문장으로 문을 연다</button>`:""}
    <div class="fb ${S.tries?"miss":""}">${S.lastFb||(all?"지금 문장은 밤이 써 놓은 그대로입니다.":"물건마다 증거가 하나씩 있습니다.")}</div>
    <div class="cards">${OBJS.map(o=>S.found.includes(o[0])?`<div class="card"><b>${esc(v.clues[o[0]].split(" · ")[0])}</b>${esc(v.clues[o[0]].split(" · ")[1])}</div>`:`<div class="card unk"><b>?</b>아직 찾지 못함</div>`).join("")}</div>`;
  const ob=$("#objs"); if(ob) ob.onclick=e=>{ const b=e.target.closest("[data-o]"); if(b) find(b.dataset.o); };
  if(all){
    $("#sent").onclick=e=>{ const b=e.target.closest("[data-i]"); if(!b) return; const i=+b.dataset.i; S.sl[i]=(S.sl[i]+2)%3; ticks(1); keepY(a_search); };
    $("#tryBtn").onclick=()=>{ const bad=S.sl.filter(x=>x!==0).length;
      if(!bad){ S.opened=true; chime(); setTimeout(chime,250); a_search(); sync(); window.scrollTo(0,0); return; }
      S.tries++; lowBuzz(); S.lastFb=`덜컹. 세 군데 중 <b>${bad}군데</b>는 확인한 적 없는 말입니다.`+(S.tries>=3?" <br>맞은 말에 표시해 두었습니다.":"");
      keepY(a_search); sync(); const s=$("#stage"); s.classList.remove("shake"); void s.offsetWidth; s.classList.add("shake"); };
  }
}
function find(o){
  if(!OBJS.some(x=>x[0]===o)) return;
  if(OBJS.every(x=>S.found.includes(x[0]))) return;
  if(!S.found.includes(o)){ S.found.push(o); chime(); }
  S.lastFb=esc(VV().clues[o]);
  if(OBJS.every(x=>S.found.includes(x[0]))) S.lastFb="증거 여섯 개를 모두 찾았습니다. 이제 문에 적힌 문장을 고쳐 쓰세요.";
  keepY(a_search); hint("증거를 찾았습니다.");
}

      <p class="lede">${diff>=3?"빈자리는 그대로인데, 숫자가 이만큼 움직였습니다.":diff<=0?"사정을 알고도 텅 빈 느낌이 그대로입니다. 그렇다면 이 빈자리가 건드린 건 오늘 일만이 아닐 수 있습니다.":"숫자가 조금 움직였습니다."}</p>
      <div class="callout">${v.lesson}</div>
      <button class="btn" type="button" id="next">문으로 걸어간다</button>`:""}`;
  $("#after").onclick=e=>{ const b=e.target.closest("[data-n]"); if(!b) return; S.after=+b.dataset.n; keepY(a_next); };
  const nx=$("#next"); if(nx) nx.onclick=()=>{ hush(); go("a_mine",7); };

  const wx=$("#wx"); if(wx) wx.onclick=e=>{ const b=e.target.closest("[data-i]"); if(!b) return; S.whyx=+b.dataset.i; keepY(a_mine); };
  const nx=$("#next"); if(nx) nx.onclick=()=>{ const seen=store("maeum.left.seen")||[]; if(!seen.includes(S.v)){ seen.push(S.v); store("maeum.left.seen",seen); } save(); go("a_exit",8); door(); };

/* 임시 규칙: 전문가 검토 필요 */
function score(){
  let gen=0, self=0, aban=0;
  const add=t=>{ gen+=t.gen||0; self+=t.self||0; aban+=t.aban||0; };
  add(THINK[S.think]); add(FIRST[S.first]); add(RTAG[VV().acts[S.act].r]);
  gen+=ties()+Math.min(2,S.tries);
  if(S.before>=7) aban+=1; if(S.before>=9) self+=1;
  const cap=(v,m)=>Math.min(1,v/m);
  return [["‘늘’ 만들기",cap(gen,11)],["내 탓 찾기",cap(self,5)],["떠남 예감",cap(aban,8)]];
}
function type(){
  const sc=score(), top=[...sc].sort((a,b)=>b[1]-a[1])[0];
  if(top[1]<.34) return "anchor";
  if(ties()<=1 && S.tries===0 && VV().acts[S.act].r==="ask" && top[1]<.8) return "bridge";
  return top[0]==="‘늘’ 만들기"?"loop":top[0]==="내 탓 찾기"?"blame":"lock";
}
function save(){
  const log=store("maeum.left.log")||[]; const v=VV();
  log.push({at:new Date().toISOString(), story:v.k, think:THINK[S.think].t, first:FIRST[S.first].t, before:S.before, after:S.after, ties:ties(), tries:S.tries,
    act:v.acts[S.act].r, left:LEFT[S.left], whyx:WHYX[S.whyx], type:TYPES[type()].nm});
  store("maeum.left.log", log.slice(-20));
}
function a_exit(){
  const T=TYPES[type()], sc=score(), v=VV(), n=ties();
  hint("문이 열렸습니다.");
  if(!a_exit.spoken){ a_exit.spoken=true; setTimeout(()=>say(`당신의 카드는 ${T.nm}. ${T.one}.`),500); }

function score(){

  add(THINK[S.think]); add(FIRST[S.first]); add(RTAG[VV().acts[S.act].r]);
  grip+=gu(); all+=Math.min(2,rc()); must+=Math.min(2,S.wr); all+=Math.min(2,S.wg);
  if(S.before>=7) grip+=1; if(S.before>=9) must+=1;

  return [["쥐기",cap(grip,9)],["해야 한다",cap(must,8)],["틀리면 끝",cap(all,6)]];
}

  if(!pool.length){ pool=VAR.map((_,i)=>i).filter(i=>i!==seen[seen.length-1]); store("maeum.doom.seen",[]); }

    <div class="narr" style="font-size:17px">${a.out.map((l,i)=>`<span style="animation-delay:${.2+i*.9}s">${esc(l)}</span>`).join("")}</div>
    <p class="eyebrow">지금은 얼마나 불안한가요?</p>
    ${nums("after",S.after).replace("0 · 아무렇지 않다","0 · 평온하다").replace("10 · 아무것도 손에 안 잡힌다","10 · 숨이 가쁘다")}
    ${S.after!==null?`<div class="vs"><div><span class="small">어젯밤</span><span class="big">${S.before}</span></div><div class="small">→</div><div><span class="small">지금</span><span class="big">${S.after}</span></div></div>
      <p class="lede">${diff>=3?"어젯밤의 숫자는 일어난 일이 아니라, 그려 본 일에 붙어 있었습니다.":diff<=0?"결과를 알고도 불안이 그대로입니다. 그렇다면 불안은 이번 신호 하나에서만 오는 것이 아닐 수 있습니다.":"숫자가 조금 내려왔습니다."}</p>
      <div class="callout">${v.lesson}</div>
      <button class="btn" type="button" id="next">문으로 걸어간다</button>`:""}`;
  $("#after").onclick=e=>{ const b=e.target.closest("[data-n]"); if(!b) return; S.after=+b.dataset.n; keepY(d_next); };
  const nx=$("#next"); if(nx) nx.onclick=()=>{ hush(); go("d_mine",7); };
}
function d_mine(){
  hint("문고리를 잡는 순간, 문에 질문이 떠오릅니다.");
  let h=`<p class="eyebrow">지나간 걱정</p><h2>문고리를 잡는 순간, 질문 하나가 문에 떠오릅니다.</h2>
    <div class="whisper" style="border-color:var(--line);box-shadow:none;color:var(--ink)"><small>문에 새겨진 질문</small>작년 이맘때 가장 크게 걱정하던 일을, 지금 기억하나요?</div>
    <div class="chips" id="ps">${PAST.map((r,i)=>`<button class="chip" type="button" data-i="${i}" aria-pressed="${S.past===i}">${r}</button>`).join("")}</div>`;
  if(S.past!==null) h+=`<p class="eyebrow">${S.past===2?"떠오르는 아무 걱정이나 하나 골라 보세요. 그 걱정은 어떻게 됐나요?":"그 걱정은 실제로 어떻게 됐나요?"}</p>
    <div class="chips" id="ed">${ENDED.map((w,i)=>`<button class="chip" type="button" data-i="${i}" aria-pressed="${S.ended===i}">${w}</button>`).join("")}</div>`;
  if(S.ended!==null) h+=`<div class="callout">${S.ended===0?"걱정한 대로 된 일도 있습니다. 그리고 당신은 그 일을 지나 지금 이 문 앞에 서 있습니다. 감당하지 못할 거라던 일을 지나왔습니다.":S.ended===3?"그때는 밤잠을 설치게 한 걱정이, 지금은 어떻게 끝났는지도 기억나지 않습니다. 오늘 밤의 걱정도 일 년 뒤에는 그럴 수 있습니다.":`“${ENDED[S.ended]}.” 그때의 예감과 실제 결말은 달랐습니다. 오늘 밤의 예감도 아직 결말이 아닙니다.`}</div>
    <button class="btn" type="button" id="next">문을 연다</button>`;
  V().innerHTML=h;
  $("#ps").onclick=e=>{ const b=e.target.closest("[data-i]"); if(!b) return; S.past=+b.dataset.i; keepY(d_mine); };
  const ed=$("#ed"); if(ed) ed.onclick=e=>{ const b=e.target.closest("[data-i]"); if(!b) return; S.ended=+b.dataset.i; keepY(d_mine); };
  const nx=$("#next"); if(nx) nx.onclick=()=>{ const seen=store("maeum.doom.seen")||[]; if(!seen.includes(S.v)){ seen.push(S.v); store("maeum.doom.seen",seen); } save(); go("d_exit",8); door(); };
}
/* 임시 규칙: 전문가 검토 필요 */
function score(){
  let cat=0, check=0, cope=0;
  const add=t=>{ cat+=t.cat||0; check+=t.check||0; cope+=t.cope||0; };
  add(THINK[S.think]); add(FIRST[S.first]); add(RTAG[VV().acts[S.act].r]);
  cat+=esc7()+Math.min(2,S.wc); check+=Math.min(2,S.wm); cope+=Math.min(2,S.wr);
  if(S.before>=7) cat+=1; if(S.before>=9) cope+=1;
  const cap=(v,m)=>Math.min(1,v/m);
  return [["최악 그리기",cap(cat,11)],["확인 반복",cap(check,6)],["감당 못 해",cap(cope,6)]];
}
function type(){
  const sc=score(), top=[...sc].sort((a,b)=>b[1]-a[1])[0];
  if(top[1]<.34) return "compass";
  if(esc7()<=1 && S.tries===0 && VV().acts[S.act].r==="one" && top[1]<.8) return "vest";
  return top[0]==="최악 그리기"?"seer":top[0]==="확인 반복"?"reload":"boat";
}
function save(){
  const log=store("maeum.doom.log")||[]; const v=VV();
  log.push({at:new Date().toISOString(), story:v.k, think:THINK[S.think].t, first:FIRST[S.first].t, before:S.before, after:S.after, steps:esc7(), tries:S.tries, worst:S.wc, half:S.wm, rosy:S.wr,
    act:v.acts[S.act].r, past:PAST[S.past], ended:ENDED[S.ended], type:TYPES[type()].nm});
  store("maeum.doom.log", log.slice(-20));
}
function d_exit(){
  const T=TYPES[type()], sc=score(), v=VV(), n=esc7();
  hint("문이 열렸습니다.");
  if(!d_exit.spoken){ d_exit.spoken=true; setTimeout(()=>say(`당신의 카드는 ${T.nm}. ${T.one}.`),500); }
  V().innerHTML=`<p class="eyebrow">탈출 · 방 7</p><h2>재앙의 방에서 나왔습니다.</h2>
    <div class="tcard ${S.flip?"flip":""}" id="tc"><div class="in">
      <div class="f"><span class="emo">${T.emo}</span><span class="small">재앙의 방에서 받은 카드</span><span class="nm">${T.nm}</span><span class="one">${T.one}</span><span>${T.s}</span><span class="small" style="margin-top:auto">눌러서 뒷면 보기</span></div>
      <div class="b"><p class="eyebrow">카드 뒷면 · 오늘 이 방에서 보인 반응</p>
        <div class="meter">${sc.map(([nm,x])=>`<div class="row"><span>${nm}</span><span class="bar"><i style="width:${Math.max(6,Math.round(x*100))}%"></i></span><span class="lv">${x>=.6?"자주":x>=.3?"가끔":"드묾"}</span></div>`).join("")}</div>
        <p class="small">${T.w}</p>
        <p class="small">이 카드는 당신을 정하는 유형이 아니라, 오늘 이 방에서 나타난 반응입니다.</p>
        <span class="small" style="margin-top:auto">눌러서 앞면 보기</span></div>
    </div></div>
    <div class="vs"><div><span class="small">어젯밤 불안</span><span class="big">${S.before}</span></div><div class="small">→</div><div><span class="small">다음 날</span><span class="big">${S.after}</span></div></div>
    <p class="eyebrow">오늘 내 생각 고리</p>
    <ol class="chain">
      <li><span>사건</span>${esc(v.event)}</li>
      <li><span>내 생각</span>“${esc(FIRST[S.first].t)}”</li>
      <li><span>그다음엔?</span>${n?`상상을 ${n}걸음 따라감 · 물이 ${n===3?"허리":n===2?"무릎":"발목"}까지 참`:"따라가지 않음"}</li>
      <li><span>내 행동</span>${esc(v.acts[S.act].t)}</li>
    </ol>
    <div class="habit">
      <p class="eyebrow">생각 습관 카드 · 12장 중 한 장 획득</p>
      <p class="habit-name">수정 구슬 (나쁜 결말 점치기)</p>
      <p>아직 일어나지 않은 일의 결말을 가장 나쁜 쪽으로 미리 정해 두는 습관입니다. 신호 하나에서 출발해 “그다음엔, 그다음엔” 하고 끝까지 달려갈 때 나타납니다.</p>
      <p class="small">오늘의 열쇠: 세 가지를 묻기. “가능성은 얼마나 되나, 가장 그럴듯한 일은 무엇인가, 그래도 나쁘면 나는 무엇을 할 수 있나.”</p>
    </div>
    <button class="btn" type="button" id="share">카드 문구 복사해서 공유하기</button>
    <p class="copyok" id="copyok"></p>
    <button class="btn ghost" type="button" id="again">다른 이야기로 다시 들어가기</button>
    <button class="btn ghost" type="button" id="map">처음 화면으로</button>
    <p class="small">기록은 이 기기에만 저장됩니다. 처음 화면 아래에서 언제든 지울 수 있습니다.</p>`;
  $("#tc").onclick=()=>{ S.flip=!S.flip; $("#tc").classList.toggle("flip",S.flip); };
  $("#map").onclick=goHome; $("#again").onclick=start;
  $("#share").onclick=async()=>{
    const url=/^https?:/.test(location.href)&&!/claude/.test(location.hostname)?`\n${location.href.split("#")[0]}`:"";
    const text=`[마음의 방탈출 · 재앙의 방]\n내 카드: ${T.emo} ${T.nm}\n“${T.one}”\n불안 ${S.before} → ${S.after}\n너는 무슨 카드가 나올까?${url}`;
    try{ await navigator.clipboard.writeText(text); $("#copyok").textContent="복사했습니다. 카톡에 붙여 넣으세요."; }
    catch(e){ $("#copyok").textContent="이 화면에서는 복사가 막혀 있습니다. 카드를 캡처해 주세요."; }
  };
}
function touch(obj){
  if(S.view==="d_enter"){ hint("먼저 불을 켜야 합니다."); return; }
  if(S.view==="d_moment" && obj==="phone" && S.beat<0){ runBeat(); return; }
  if(S.view==="d_search" && !S.opened && obj!=="door"){ find(obj); return; }
  if(obj==="door"){ hint(S.view==="d_exit"?"문이 열려 있습니다.":"문에 밸브 세 개가 달려 있습니다. “상상이 아니라 따져 본 것만 물을 뺀다.”"); return; }
  hint(({window:"창밖은 캄캄합니다.",calendar:"달력에 글씨가 적혀 있습니다.",frame:"책상 위에 종이가 놓여 있습니다.",drawer:"서랍이 살짝 열려 있습니다.",phone:"휴대전화 화면이 켜져 있습니다."})[obj]||"");
}
return {no:7, name:"재앙의 방", steps:STEPS, scene:SCENE, start, sync, touch, type, VAR, THINK, FIRST,
  views:{d_enter, d_moment, d_first, d_fork, d_search, d_act, d_next, d_mine, d_exit}};
})();

SCENE2=$("#room3d").innerHTML;
render();
</script>
</body>
</html>
