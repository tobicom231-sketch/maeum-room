<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>사라진 정원사 · 씨앗 창고 시험판</title>
<style>
:root{
  --bg:#14110d; --wood:#2a2118; --wood2:#3a2d20; --line:#5a4632;
  --glow:#f2b14a; --glow2:#ffd98a; --leaf:#9fd0a0; --ink:#f3ead8; --dim:#b9a98c;
  --paper:#efe3c0; --paperink:#3b2f1e; --bad:#e08a6a;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);
  font-family:"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",system-ui,sans-serif;
  font-size:18px;line-height:1.65}
body{display:flex;justify-content:center}
#app{width:100%;max-width:520px;min-height:100%;padding:18px 18px 110px;position:relative}
.top{display:flex;justify-content:space-between;align-items:center;font-size:14px;color:var(--dim);margin-bottom:10px}
.top span{display:flex;gap:6px}
.top button{background:none;border:1px solid var(--line);color:var(--dim);border-radius:999px;padding:6px 12px;font-size:14px}
.season{letter-spacing:.2em}
h1{font-family:"Nanum Myeongjo","AppleMyungjo","Batang",serif;font-size:28px;margin:18px 0 6px;font-weight:700}
h2{font-family:"Nanum Myeongjo","AppleMyungjo","Batang",serif;font-size:22px;margin:14px 0 10px;font-weight:700;line-height:1.45}
p{margin:10px 0}
.dim{color:var(--dim);font-size:15px}
.diary{background:var(--paper);color:var(--paperink);border-radius:6px;padding:18px 20px;margin:16px 0;
  font-family:"Nanum Myeongjo","AppleMyungjo","Batang",serif;box-shadow:0 10px 30px #0008;transform:rotate(-.6deg)}
.diary p{margin:6px 0}
.btn{display:block;width:100%;border:0;border-radius:14px;padding:17px 16px;margin:12px 0;font-size:19px;font-weight:700;
  background:var(--glow);color:#2a1c06;box-shadow:0 0 24px #f2b14a44}
.btn:active{transform:scale(.98)}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line);box-shadow:none;font-weight:500}
.btn.small{font-size:16px;padding:12px}
.opt{display:block;width:100%;text-align:left;border:1.5px solid var(--line);background:var(--wood);color:var(--ink);
  border-radius:14px;padding:16px 16px;margin:10px 0;font-size:18px}
.opt:active{background:var(--wood2);border-color:var(--glow)}
.row{display:flex;gap:10px}.row>*{flex:1}
/* 서랍 */
.cab{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;background:var(--wood);padding:12px;border-radius:12px;border:1px solid var(--line);margin:14px 0}
.drawer{aspect-ratio:1.25;border-radius:8px;border:1.5px solid var(--line);background:linear-gradient(#3a2d20,#261d14);
  color:var(--glow2);font-size:26px;font-weight:700;position:relative;font-family:serif}
.drawer::after{content:"";position:absolute;left:50%;bottom:16%;width:26%;height:7px;border-radius:4px;background:#8a6a3c;transform:translateX(-50%)}
.drawer::before{content:"";position:absolute;right:10%;top:12%;width:7px;height:7px;border-radius:50%;background:var(--glow);box-shadow:0 0 12px 4px #f2b14a88;animation:fly 3s infinite ease-in-out}
.drawer:nth-child(2n)::before{animation-delay:-1.2s}.drawer:nth-child(3n)::before{animation-delay:-2s}
@keyframes fly{0%,100%{opacity:.35}50%{opacity:1}}
.drawer.no{animation:shake .35s}
.drawer.yes{background:linear-gradient(#f2b14a,#b97a22);color:#2a1c06;box-shadow:0 0 30px #f2b14aaa}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.note{background:#e9dcb6;color:var(--paperink);padding:14px 16px;border-radius:4px;transform:rotate(.8deg);
  font-family:"Nanum Myeongjo","AppleMyungjo","Batang",serif;box-shadow:0 6px 18px #0007;margin:14px 0}
.todo{background:#9fd0a018;border:1.5px solid #9fd0a066;border-radius:12px;padding:12px 14px;margin:12px 0;font-size:17px}
.todo b{display:inline-block;background:var(--leaf);color:#12301a;border-radius:6px;padding:0 8px;margin-right:6px;font-size:14px}
.hint{border-left:3px solid var(--leaf);padding:8px 12px;margin:10px 0;color:var(--leaf);font-size:16px;background:#9fd0a011;border-radius:0 8px 8px 0}
/* 꽃 카드 */
.cards{display:grid;gap:12px;margin:14px 0}
.card{border:1.5px solid var(--line);border-radius:14px;background:var(--wood);overflow:hidden}
.card.open{border-color:var(--glow);box-shadow:0 0 22px #f2b14a33}
.chead{display:flex;align-items:center;gap:12px;width:100%;background:none;border:0;color:var(--ink);padding:12px 14px;font-size:18px;text-align:left}
.chead .n{width:38px;height:38px;border-radius:50%;border:1.5px solid var(--glow);color:var(--glow2);display:grid;place-items:center;font-weight:700;flex:none;font-family:serif}
.chead .seen{margin-left:auto;font-size:13px;color:var(--dim)}
.cbody{padding:0 14px 14px;display:none}
.card.open .cbody{display:block}
.cbody .txt{background:var(--paper);color:var(--paperink);border-radius:6px;padding:14px 16px;font-family:"Nanum Myeongjo","AppleMyungjo","Batang",serif}
.flower{display:block;margin:0 auto 4px;width:120px;height:120px}
.nums{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.fade{animation:fade .5s both}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
table{width:100%;border-collapse:collapse;font-size:15px;margin:10px 0}
th,td{border-bottom:1px solid var(--line);padding:8px 6px;text-align:left;vertical-align:top}
th{color:var(--dim);font-weight:500}
.tag{display:inline-block;font-size:13px;border:1px solid var(--line);border-radius:999px;padding:2px 10px;color:var(--dim);margin-bottom:6px}
.help{position:fixed;right:14px;bottom:14px;background:#0009;border:1.5px solid var(--line);color:var(--ink);border-radius:999px;padding:10px 16px;font-size:15px;backdrop-filter:blur(6px)}
.toast{position:fixed;left:50%;bottom:70px;transform:translateX(-50%);background:#000c;color:var(--ink);padding:10px 16px;border-radius:10px;font-size:15px;max-width:86%;text-align:center}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
</head>
<body>
<div id="app"></div>
<button class="help" id="helpBtn" hidden>도움 부르기</button>
<script>
"use strict";
/* ===== 자료 ===== */
const FLOWERS=[
 {n:1,short:"마당 구석에 내놓고 잊어버린 꽃",txt:"주인이 마당 구석에 내놓고 잊어버린 꽃입니다. 비와 바람을 혼자 맞았습니다. 그래서 줄기가 굵고 뿌리가 깊습니다. 누가 다가오면 잎을 조금 움츠립니다.",stem:7,bloom:15,lean:-6},
 {n:2,short:"방 안에서 자랐지만 눈길은 받지 못한 꽃",txt:"방 안에서 자랐지만 물도 영양제도 가끔만 받은 꽃입니다. 집 안에 있었을 뿐 눈길은 받지 못했습니다. 적은 물로 버티는 법을 익혔습니다. 많이 바라지 않습니다.",stem:3.5,bloom:13,lean:0},
 {n:3,short:"물과 영양제를 제때 받았지만 말은 듣지 못한 꽃",txt:"물과 영양제를 제때 꼬박꼬박 받은 꽃입니다. 부족한 것은 없었습니다. 다만 주인은 잎을 닦아 주거나 말을 걸지는 않았습니다. 겉은 건강한데, 누가 말을 걸면 어떻게 해야 할지 모릅니다.",stem:5,bloom:17,lean:0},
 {n:4,short:"주인이 잎을 닦아 주며 말을 걸어 준 꽃",txt:"물도 영양제도 잘 받고, 주인이 잎을 닦아 주며 말을 걸어 준 꽃입니다. 꽃이 크고 색이 곱습니다. 혼자 있어 본 적이 없어서 주인이 집을 비우면 금세 시듭니다.",stem:4.5,bloom:22,lean:4},
 {n:5,short:"주인이 여러 번 바뀐 꽃",txt:"주인이 여러 번 바뀐 꽃입니다. 이 집 저 집을 옮겨 다녔습니다. 어디서든 금방 뿌리를 내립니다. 깊이 내리지는 않습니다.",stem:4,bloom:16,lean:8}
];
const REASONS=["나와 닮아서","돌봐 주고 싶어서","강해 보여서","손이 덜 갈 것 같아서","가장 예뻐 보여서","왠지 눈이 가서"];
const VOICES=["고생했다","이제 내가 있을게","너는 그대로 괜찮다","혼자서도 잘했다","아무 말 없이 곁에 있어 주기"];
const SEEDS=["한 봉투 가져간다","있는 만큼 가져간다","가져가지 않는다","다음 사람을 위해 남겨 둔다"];
const KEY="gardener.seed.log";

/* ===== 상태 ===== */
let S, voiceOn=true, toastT;
function fresh(){return {step:0,t0:Date.now(),
  riddle:{start:0,ms:0,wrong:0,hintSelf:false,hintShown:0,help:0},
  pick:{start:0,ms:0,opened:[],reopen:0,changes:0,flower:null,first:null},
  reason:null,voice:null,avoid:null,seed:null,help:0};}
const $=s=>document.querySelector(s);
const app=$("#app");
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

/* ===== 소리와 음성 ===== */
let AC;
function beep(f,d,type,vol){try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();
  const o=AC.createOscillator(),g=AC.createGain();o.type=type||"sine";o.frequency.value=f;
  g.gain.setValueAtTime(vol||.08,AC.currentTime);g.gain.exponentialRampToValueAtTime(.0001,AC.currentTime+d);
  o.connect(g).connect(AC.destination);o.start();o.stop(AC.currentTime+d);}catch(e){}}
const sndTap=()=>beep(220,.08,"triangle",.06);
const sndNo=()=>{beep(110,.18,"sawtooth",.05)};
const sndYes=()=>{beep(523,.25);setTimeout(()=>beep(784,.4),140)};
let VOICE=null, sayId=0, warned=false;
function pickVoice(){try{const vs=speechSynthesis.getVoices();VOICE=vs.find(v=>/^ko/i.test(v.lang))||null;}catch(e){}}
try{pickVoice();speechSynthesis.onvoiceschanged=pickVoice;}catch(e){}
function noVoice(){if(warned)return;warned=true;toast("이 화면에서는 음성이 나오지 않습니다. 글로 읽어 주세요.");}
let lastSay="";
function say(t){lastSay=t;const id=++sayId;
  if(!("speechSynthesis" in window)){if(voiceOn)noVoice();return;}
  try{speechSynthesis.cancel();}catch(e){}
  if(!voiceOn)return;
  setTimeout(()=>{ if(id!==sayId)return;
    try{ if(!VOICE)pickVoice();
      const u=new SpeechSynthesisUtterance(t);u.lang="ko-KR";u.rate=.92;if(VOICE)u.voice=VOICE;
      let started=false;u.onstart=()=>{started=true};
      u.onerror=e=>{if(e.error!=="canceled"&&e.error!=="interrupted")noVoice();};
      speechSynthesis.resume();speechSynthesis.speak(u);
      setTimeout(()=>{if(id===sayId&&!started)noVoice();},2500);
    }catch(e){noVoice();}
  },120);}
function hush(){sayId++;try{speechSynthesis.cancel()}catch(e){}}
function toast(t){let el=$(".toast");if(el)el.remove();el=document.createElement("div");el.className="toast";el.textContent=t;
  document.body.appendChild(el);clearTimeout(toastT);toastT=setTimeout(()=>el.remove(),2600);}

/* ===== 꽃 그림 (모두 같은 종류, 사연에 맞게 조금씩 다름) ===== */
function flowerSVG(f){
  const b=f.bloom, cx=60+f.lean, cy=44, petals=[];
  for(let i=0;i<8;i++){const a=i*Math.PI/4, x=cx+Math.cos(a)*b*.62, y=cy+Math.sin(a)*b*.62;
    petals.push(`<ellipse cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" rx="${(b*.52).toFixed(1)}" ry="${(b*.3).toFixed(1)}" transform="rotate(${i*45} ${x.toFixed(1)} ${y.toFixed(1)})" fill="#e9a2b4" opacity=".92"/>`);}
  return `<svg class="flower" viewBox="0 0 120 120" aria-hidden="true">
  <path d="M60 108 Q${60+f.lean/2} 80 ${cx} ${cy+8}" stroke="#7fb27f" stroke-width="${f.stem}" fill="none" stroke-linecap="round"/>
  <path d="M60 88 q-18 -8 -24 4 q14 6 24 -4z" fill="#8cc08c"/><path d="M61 76 q16 -10 24 0 q-12 8 -24 0z" fill="#7fb27f"/>
  ${petals.join("")}<circle cx="${cx}" cy="${cy}" r="${(b*.3).toFixed(1)}" fill="#f2c14a"/>
  <path d="M42 108 h36 l-4 10 h-28z" fill="#8a5a3a"/></svg>`;
}

/* ===== 틀 ===== */
function shell(inner,season){
  app.innerHTML=`<div class="top"><span class="season">${season||"씨앗 창고 · 이른 봄"}</span>
  <span><button id="rBtn">다시 듣기</button> <button id="vBtn">${voiceOn?"음성 켜짐":"음성 꺼짐"}</button></span></div><div class="fade">${inner}</div>`;
  $("#vBtn").onclick=()=>{voiceOn=!voiceOn;if(!voiceOn)hush();$("#vBtn").textContent=voiceOn?"음성 켜짐":"음성 꺼짐";};
  $("#rBtn").onclick=()=>{voiceOn=true;$("#vBtn").textContent="음성 켜짐";warned=false;if(lastSay)say(lastSay);};
  lastSay="";window.scrollTo(0,0);
  $("#helpBtn").hidden=!(S.step>=2&&S.step<=7);
}
function go(n){hush();S.step=n;VIEWS[n]();}
function opts(list,cb){return list.map((t,i)=>`<button class="opt" data-i="${i}">${esc(t)}</button>`).join("");}
function bindOpts(cb){app.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{sndTap();cb(+b.dataset.i);});}

/* ===== 화면 ===== */
const DIARY=["이른 봄. 올해 심을 꽃을 고르는 날이다.","창고에는 다섯 포기가 겨울을 났다. 저마다 다르게 났다.",
 "나는 해마다 여기서 오래 서 있는다. 무엇을 고르든, 고르고 나면 그 꽃이 내 한 해가 되기 때문이다.","서랍 열쇠 번호는 쪽지에 적어 두었다. 나만 알아보게."];
const VIEWS={
0(){ shell(`<span class="tag">시험판</span><h1>사라진 정원사</h1><p class="dim">첫 번째 방 · 씨앗 창고</p>
  <p>온실의 정원사가 사라졌습니다. 남은 것은 일지 한 권입니다.<br>일지를 따라 정원사의 한 해를 걸어 봅니다.</p>
  <p class="dim">이 온실은 당신의 선택을 기억했다가 마지막에 돌려줍니다. 맞는 답은 없습니다. 끌리는 대로 고르시면 됩니다.</p>
  <button class="btn" id="start">손목 띠를 댑니다</button>
  <button class="btn ghost small" id="vtest">소리 시험해 보기</button>
  <button class="btn ghost small" id="logs">시험 기록 보기</button>`,"해 질 녘의 온실");
  lastSay="사라진 정원사. 첫 번째 방, 씨앗 창고. 온실의 정원사가 사라졌습니다. 남은 것은 일지 한 권입니다. 일지를 따라 정원사의 한 해를 걸어 봅니다. 이 온실은 당신의 선택을 기억했다가 마지막에 돌려줍니다. 맞는 답은 없습니다. 끌리는 대로 고르시면 됩니다. 준비되면 손목 띠를 댑니다 단추를 누르세요.";
  $("#vtest").onclick=()=>{sndYes();warned=false;voiceOn=true;$("#vBtn").textContent="음성 켜짐";say("소리가 들리면 음성이 나오는 기기입니다.");};
  $("#start").onclick=()=>{sndYes();go(1);}; $("#logs").onclick=()=>go(99);
},
1(){ shell(`<h2>정원사의 일지</h2><div class="diary">${DIARY.map(l=>`<p>${l}</p>`).join("")}</div>
  <button class="btn" id="n">창고로 들어간다</button><button class="btn ghost small" id="again">다시 듣기</button>`);
  say(DIARY.join(" ")); $("#again").onclick=()=>say(DIARY.join(" "));
  $("#n").onclick=()=>{sndTap();go(2);};
},
2(){ const R=S.riddle; if(!R.start)R.start=Date.now();
  shell(`<h2>꽃이 든 서랍을 찾으세요</h2>
  <div class="todo"><b>할 일</b> 아래 쪽지의 수수께끼를 풀어 서랍 번호를 알아내고, 그 번호의 서랍을 누르세요.</div>
  <p class="dim">정원사가 남긴 쪽지</p>
  <div class="note">꽃을 넣어 둔 서랍 번호를 잊을까 봐 적어 둔다.<br>나는 한 주에 두 번, 월요일과 목요일에 물을 준다.<br><b>삼 주 동안 물을 준 횟수가 서랍 번호다.</b></div>
  <div id="hints"></div>
  <div class="cab">${[1,2,3,4,5,6,7,8,9].map(n=>`<button class="drawer" data-n="${n}">${n}</button>`).join("")}</div>
  <button class="btn ghost small" id="hint">귀띔 보기</button>`);
  const H=["한 주에 물을 몇 번 주었을까요?","두 번씩 삼 주입니다."];
  const draw=()=>{$("#hints").innerHTML=H.slice(0,R.hintShown).map(h=>`<div class="hint">${h}</div>`).join("");
    if(R.hintShown>=2)$("#hint").hidden=true;};
  draw(); say("꽃이 든 서랍을 찾으세요. 아래 쪽지의 수수께끼를 풀어 서랍 번호를 알아내고, 그 번호의 서랍을 누르세요. 정원사가 남긴 쪽지입니다. 꽃을 넣어 둔 서랍 번호를 잊을까 봐 적어 둔다. 나는 한 주에 두 번, 월요일과 목요일에 물을 준다. 삼 주 동안 물을 준 횟수가 서랍 번호다.");
  $("#hint").onclick=()=>{sndTap();R.hintSelf=true;if(R.hintShown<2)R.hintShown++;draw();say("귀띔입니다. "+H[R.hintShown-1]);};
  app.querySelectorAll(".drawer").forEach(d=>d.onclick=()=>{
    if(+d.dataset.n===6){d.classList.add("yes");sndYes();R.ms=Date.now()-R.start;setTimeout(()=>go(3),800);}
    else{R.wrong++;sndNo();toast(d.dataset.n+"번 서랍은 비어 있습니다. 쪽지를 다시 읽어 보세요.");d.classList.remove("no");void d.offsetWidth;d.classList.add("no");
      if(R.wrong>=3&&R.hintShown<1){R.hintShown=1;draw();say("귀띔입니다. "+H[0]);}
      else if(R.wrong>=6&&R.hintShown<2){R.hintShown=2;draw();say("귀띔입니다. "+H[1]);}
      else say(d.dataset.n+"번 서랍은 비어 있습니다. 쪽지를 다시 읽어 보세요.");}
  });
},
3(){ const P=S.pick; if(!P.start)P.start=Date.now();
  shell(`<h2>서랍 속의 다섯 포기</h2><div class="todo"><b>할 일</b> 번호를 눌러 다섯 포기의 사연을 읽고, 마음이 가는 한 포기에서 '이 꽃으로'를 누르세요. 꽃은 모두 같은 종류입니다.</div>
  <div class="cards">${FLOWERS.map(f=>`<div class="card" data-n="${f.n}">
    <button class="chead"><span class="n">${f.n}</span><span>${f.n}번 꽃</span><span class="seen">${P.opened.includes(f.n)?"읽음":""}</span></button>
    <div class="cbody">${flowerSVG(f)}<div class="txt">${f.txt}</div>
    <div class="row"><button class="btn ghost small listen">다시 듣기</button><button class="btn small choose">이 꽃으로</button></div></div></div>`).join("")}</div>`);
  say("서랍 속의 다섯 포기입니다. 번호를 눌러 다섯 포기의 사연을 들어 보고, 마음이 가는 한 포기에서 이 꽃으로 단추를 누르세요. 꽃은 모두 같은 종류입니다.");
  app.querySelectorAll(".card").forEach(c=>{const n=+c.dataset.n,f=FLOWERS[n-1];
    c.querySelector(".chead").onclick=()=>{sndTap();const was=c.classList.contains("open");
      app.querySelectorAll(".card").forEach(x=>x.classList.remove("open"));
      if(!was){c.classList.add("open");if(P.opened.includes(n))P.reopen++;else P.opened.push(n);
        c.querySelector(".seen").textContent="읽음";say(n+"번 꽃. "+f.txt);c.scrollIntoView({block:"nearest",behavior:"smooth"});}else hush();};
    c.querySelector(".listen").onclick=()=>say(f.txt);
    c.querySelector(".choose").onclick=()=>{sndYes();if(P.flower===null)P.first=n;P.flower=n;go(31);};
  });
},
31(){ const P=S.pick,f=FLOWERS[P.flower-1];
  shell(`<h2>${f.n}번 꽃을 들었습니다</h2>${flowerSVG(f)}<div class="diary"><p>${f.txt}</p></div>
  <button class="btn" id="ok">이 꽃으로 정한다</button>
  ${P.changes<1?`<button class="btn ghost small" id="back">다시 고른다</button>`:`<p class="dim">바꾸기는 한 번까지입니다.</p>`}`);
  say(f.n+"번 꽃을 들었습니다. "+f.txt+" 이 꽃으로 정하려면 정한다 단추를, "+(P.changes<1?"다시 고르려면 다시 고른다 단추를 누르세요.":"누르세요. 바꾸기는 한 번까지입니다."));
  $("#ok").onclick=()=>{sndTap();P.ms=Date.now()-P.start;go(4);};
  const b=$("#back"); if(b)b.onclick=()=>{sndTap();P.changes++;go(3);};
},
4(){ shell(`<h2>이 꽃에 손이 간 까닭은 무엇인가요?</h2>${opts(REASONS)}`);
  say("이 꽃에 손이 간 까닭은 무엇인가요? 하나를 고르세요. "+REASONS.join(". ")+"."); bindOpts(i=>{S.reason=REASONS[i];go(5);});
},
5(){ shell(`<h2>이 꽃이 지금 가장 듣고 싶은 말은 무엇일까요?</h2>${opts(VOICES)}`);
  say("이 꽃이 지금 가장 듣고 싶은 말은 무엇일까요? 하나를 고르세요. "+VOICES.join(". ")+"."); bindOpts(i=>{S.voice=VOICES[i];go(6);});
},
6(){ const rest=FLOWERS.filter(f=>f.n!==S.pick.flower);
  shell(`<h2>남은 꽃 가운데 가장 오래 보고 싶지 않았던 꽃이 있었나요?</h2>
  ${rest.map(f=>`<button class="opt" data-v="${f.n}">${f.n}번 · ${f.short}</button>`).join("")}
  <button class="opt" data-v="0">없었다</button>`);
  say("남은 꽃 가운데 가장 오래 보고 싶지 않았던 꽃이 있었나요? "+rest.map(f=>f.n+"번, "+f.short).join(". ")+". 또는, 없었다.");
  app.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{sndTap();S.avoid=+b.dataset.v;go(7);});
},
7(){ const t="서랍 안쪽에 씨앗 봉투가 몇 개 남아 있습니다. 정원사는 필요한 사람이 가져가라고 적어 두었습니다.";
  shell(`<h2>남은 씨앗</h2><p>${t}</p><div class="todo"><b>할 일</b> 어떻게 할지 하나를 고르세요.</div>${opts(SEEDS)}`); say(t+" 어떻게 할지 하나를 고르세요. "+SEEDS.join(". ")+".");
  bindOpts(i=>{S.seed=SEEDS[i];save();go(8);});
},
8(){ const P=S.pick,f=FLOWERS[P.flower-1],R=S.riddle;
  const lines=[`봄. 나는 다섯 포기 가운데 '${f.short}'을 골랐다.`,`까닭은 '${S.reason}'였다.`,
   `나는 그 꽃이 '${S.voice}'라는 말을 듣고 싶어 한다고 여겼다.`,
   `고르기까지 ${dur(P.ms)}가 걸렸고, 다섯 장 가운데 ${P.opened.length}장을 읽었다.`];
  if(P.changes>0&&P.first!==P.flower)lines.push("한 번 골랐다가 바꾸었다.");
  else if(P.changes>0)lines.push("한 번 내려놓았다가 같은 꽃을 다시 들었다.");
  if(S.avoid)lines.push(`${S.avoid}번 꽃은 오래 보지 않았다.`);
  shell(`<h2>일지에 적힌 오늘</h2><p class="dim">실제 온실에서는 마지막 방에서 한 해의 일지로 돌려받습니다. 시험판에서는 이 방의 몫만 먼저 보여 드립니다.</p>
  <div class="diary">${lines.map(l=>`<p>${esc(l)}</p>`).join("")}</div>
  <h2>이 방이 기억한 것</h2>
  <table><tr><th>서랍 수수께끼</th><td>${dur(R.ms)}, 틀린 횟수 ${R.wrong}번, 귀띔 ${R.hintSelf?"스스로 봄":(R.hintShown?"저절로 뜸":"보지 않음")}</td></tr>
  <tr><th>꽃 고르기</th><td>${dur(P.ms)}, 읽은 카드 ${P.opened.length}장, 다시 펼침 ${P.reopen}번, 바꾸기 ${P.changes}번</td></tr>
  <tr><th>남은 씨앗</th><td>${esc(S.seed)}</td></tr><tr><th>도움 부르기</th><td>${S.help}번</td></tr></table>
  <button class="btn" id="re">처음으로 (다음 사람)</button><button class="btn ghost small" id="logs">시험 기록 보기</button>`,"그림자가 길어진 온실");
  say("일지에 적힌 오늘입니다. "+lines.join(" ")+" 고른 꽃을 들고 다음 문으로 가세요. 온실에 그림자가 길어졌습니다.");
  $("#re").onclick=()=>{S=fresh();go(0);}; $("#logs").onclick=()=>go(99);
},
99(){ const L=load();
  const cnt=k=>{const m={};L.forEach(r=>{const v=r[k];m[v]=(m[v]||0)+1});return Object.entries(m).sort((a,b)=>b[1]-a[1]).map(([v,c])=>`${esc(v)} ${c}명`).join(", ")||"없음";};
  shell(`<h2>시험 기록 (이 기기)</h2><p class="dim">이 기기에서 끝까지 한 사람 ${L.length}명. 한 꽃에 절반 넘게 몰리면 설명서 글을 고쳐야 합니다.</p>
  <table><tr><th>고른 꽃</th><td>${cnt("flower")}</td></tr><tr><th>까닭</th><td>${cnt("reason")}</td></tr>
  <tr><th>듣고 싶은 말</th><td>${cnt("voice")}</td></tr><tr><th>피한 꽃</th><td>${cnt("avoid")}</td></tr><tr><th>남은 씨앗</th><td>${cnt("seed")}</td></tr></table>
  <table><tr><th>#</th><th>꽃</th><th>까닭</th><th>고른 시간</th><th>읽음</th><th>바꿈</th></tr>
  ${L.map((r,i)=>`<tr><td>${i+1}</td><td>${esc(r.flower)}</td><td>${esc(r.reason)}</td><td>${dur(r.pickMs)}</td><td>${r.opened}장</td><td>${r.changes}</td></tr>`).join("")}</table>
  <button class="btn ghost small" id="copy">기록 복사하기</button><button class="btn ghost small" id="clr">기록 모두 지우기</button><button class="btn" id="home">돌아가기</button>`,"시험 기록");
  $("#home").onclick=()=>go(S.seed?8:0);
  $("#copy").onclick=()=>{const t=JSON.stringify(L);(navigator.clipboard?navigator.clipboard.writeText(t):Promise.reject()).then(()=>toast("복사했습니다. 채팅에 붙여 넣어 주세요."),()=>toast("복사하지 못했습니다."));};
  let armed=false; $("#clr").onclick=e=>{if(!armed){armed=true;e.target.textContent="한 번 더 누르면 지워집니다";return;}
    try{localStorage.removeItem(KEY)}catch(x){} go(99);};
}};
function dur(ms){const s=Math.round((ms||0)/1000);return s<60?`${s}초`:`${Math.floor(s/60)}분 ${s%60}초`;}
function load(){try{return JSON.parse(localStorage.getItem(KEY)||"[]")}catch(e){return []}}
function save(){const P=S.pick,R=S.riddle;const rec={at:new Date().toISOString(),flower:P.flower+"번",first:P.first,reason:S.reason,voice:S.voice,
  avoid:S.avoid?S.avoid+"번":"없었다",seed:S.seed,pickMs:P.ms,opened:P.opened.length,reopen:P.reopen,changes:P.changes,
  riddleMs:R.ms,wrong:R.wrong,hintSelf:R.hintSelf,hintShown:R.hintShown,help:S.help};
  try{const L=load();L.push(rec);localStorage.setItem(KEY,JSON.stringify(L));}catch(e){}}

$("#helpBtn").onclick=()=>{S.help++;if(S.step===2)S.riddle.help++;sndTap();toast("직원을 불렀습니다. (시험판에서는 기록만 됩니다)");};
S=fresh(); go(0);
</script>
</body>
</html>
